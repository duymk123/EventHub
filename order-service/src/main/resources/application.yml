spring:
  application:
    name: order-service
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventhub_order}?serverTimezone=UTC}"
    username: "${DB_USERNAME:eventhub}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

server:
  port: "${SERVER_PORT:8084}"
