openapi: 3.0.3
info:
  title: EventHub - Event Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng mục tiêu đối chiếu BC_32_V2 và xác nhận chủ dự án ngày 2026-10-27. Mã nguồn hiện là scaffold, chưa có endpoint nghiệp vụ.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    Event sở hữu events/categories, không sở hữu loại vé/tồn kho/zones A–D. CLOSED là ngừng bán. C03 còn quyết định venue; không tự thêm trường địa điểm bắt buộc.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Event
  description: Vòng đời Event
- name: Admin - Event
  description: Duyệt Event
- name: Organizer
  description: Event của organizer
- name: Category
  description: Danh mục Event
- name: Internal
  description: Service-to-service, không expose ra ngoài Gateway
paths:
  /events:
    post:
      tags:
      - Event
      operationId: createEvent
      summary: EVT-01 Tạo Event (DRAFT)
      description: Role ORGANIZER. Event được tạo ở trạng thái DRAFT.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: CATEGORY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Event
      operationId: searchEvents
      summary: EVT-07 Tìm kiếm Event (public)
      description: 'Hình 2.42: keyword/category/startDate/endDate và page/size; chỉ PUBLISHED. startDate/endDate là ngày trong Asia/Ho_Chi_Minh (quy ước kỹ thuật đề xuất), khoảng bao gồm hai đầu; startDate lớn hơn endDate trả 400. Chỉ áp dụng đầu lọc được gửi.'
      parameters:
      - name: keyword
        in: query
        description: Tìm theo title
        schema:
          type: string
      - name: category
        in: query
        description: categoryId
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Danh sách Event (rỗng nếu không có kết quả)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSummaryPage'
        '400':
          description: INVALID_DATE_RANGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{id}:
    parameters:
    - $ref: '#/components/parameters/EventId'
    get:
      tags:
      - Event
      operationId: getEventDetail
      summary: EVT-08 Xem chi tiết Event (public)
      description: |
        Chỉ trả Event PUBLISHED. Không kèm ticket types; client lấy qua
        `GET /events/{eventId}/ticket-types` của ticket-service (hoặc Gateway gom lại).
      responses:
        '200':
          description: Chi tiết Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          $ref: '#/components/responses/EventNotFound'
    put:
      tags:
      - Event
      operationId: updateEvent
      summary: EVT-02 Cập nhật Event
      description: Chỉ ORGANIZER sở hữu, trạng thái DRAFT hoặc REJECTED; sửa REJECTED đưa lại DRAFT theo Hình 2.37. startTime < endTime.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/InvalidEventState'
  /events/{id}/submit:
    post:
      tags:
      - Event
      operationId: submitEvent
      summary: EVT-03 Nộp duyệt
      description: DRAFT → SUBMITTED, kiểm tra owner. Điều kiện đủ ba hạng/quota trước submit chưa được V2 chốt (C08); không tự bắt buộc.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Đã chuyển sang SUBMITTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/InvalidEventState'
  /events/{id}/publish:
    post:
      tags:
      - Event
      operationId: publishEvent
      summary: EVT-05 Publish Event
      description: APPROVED → PUBLISHED, chỉ owner. Quy tắc quota/đủ loại vé trước publish chờ C08.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Đã chuyển sang PUBLISHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/InvalidEventState'
  /events/{id}/close:
    post:
      tags:
      - Event
      operationId: closeEvent
      summary: EVT-06 Đóng bán vé
      description: 'PUBLISHED → CLOSED: ngừng bán theo Hình 2.41; không tự vô hiệu vé đã mua hoặc cấm check-in.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Đã chuyển sang CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NotEventOwner'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/InvalidEventState'
  /admin/events/{id}/review:
    patch:
      tags:
      - Admin - Event
      operationId: reviewEvent
      summary: EVT-04 Admin duyệt / từ chối Event
      description: Role ADMIN. Event phải đang SUBMITTED. `reason` bắt buộc khi REJECT.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
            examples:
              approve:
                value:
                  decision: APPROVE
              reject:
                value:
                  decision: REJECT
                  reason: Thiếu thông tin địa điểm
      responses:
        '200':
          description: Kết quả duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatusResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '409':
          $ref: '#/components/responses/InvalidEventState'
  /organizer/events:
    get:
      tags:
      - Organizer
      operationId: getMyEvents
      summary: EVT-09 Event của tôi
      description: Role ORGANIZER. Trả Event do organizer sở hữu, mọi trạng thái.
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EventStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Danh sách Event của organizer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /categories:
    get:
      tags:
      - Category
      operationId: listCategories
      summary: CAT-02 Danh sách Category (public)
      responses:
        '200':
          description: Danh sách Category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags:
      - Category
      operationId: createCategory
      summary: CAT-01 Tạo Category
      description: Role ADMIN.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CATEGORY_NAME_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    put:
      tags:
      - Category
      operationId: updateCategory
      summary: CAT-03 Cập nhật Category
      description: Role ADMIN.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          description: CATEGORY_NAME_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Category
      operationId: deleteCategory
      summary: CAT-04 Xóa Category
      description: Role ADMIN. Từ chối nếu Category đang được Event sử dụng (FK RESTRICT).
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Xóa thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          description: CATEGORY_IN_USE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/events/{id}:
    get:
      tags:
      - Internal
      operationId: getEventInternal
      summary: INT-01 Thông tin Event cho service khác
      description: |
        Chỉ cho service-to-service. Ticket-service dùng để:
        xác nhận organizer sở hữu Event khi cấu hình vé, lấy `startTime` cho quy tắc hủy vé 48h,
        và chặn reserve khi Event không ở PUBLISHED.
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Thông tin Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalEventResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/EventNotFound'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8082
      description: Gọi trực tiếp service, không qua public Gateway; S2S auth chưa chốt
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
    serviceAuth:
      type: http
      scheme: bearer
      description: 'Placeholder hợp đồng draft: internal bắt buộc xác thực service. Bearer là đề xuất thể hiện yêu cầu, không phải cơ chế S2S đã được chốt; thay khi có cấu hình Keycloak/S2S.'
      x-contract-status: pending-s2s-mechanism
  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: Event ID
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền (sai role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotEventOwner:
      description: NOT_EVENT_OWNER hoặc sai role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EventNotFound:
      description: EVENT_NOT_FOUND (không tồn tại, hoặc chưa PUBLISHED với API public)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotFound:
      description: CATEGORY_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidEventState:
      description: INVALID_EVENT_STATE - trạng thái hiện tại không cho phép thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EventStatus:
      type: string
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - REJECTED
      - PUBLISHED
      - CLOSED
    ReviewDecision:
      type: string
      enum:
      - APPROVE
      - REJECT
    EventRequest:
      type: object
      required:
      - title
      - categoryId
      - startTime
      - endTime
      properties:
        title:
          type: string
          maxLength: 255
          example: Đêm nhạc Mùa Đông 2026
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        startTime:
          type: string
          format: date-time
          description: Phải ở tương lai
          example: '2026-12-01T19:00:00Z'
        endTime:
          type: string
          format: date-time
          description: Phải sau startTime
          example: '2026-12-01T22:00:00Z'
    EventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        organizerId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        category:
          $ref: '#/components/schemas/CategoryRef'
        title:
          type: string
        description:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/EventStatus'
        rejectReason:
          type: string
          nullable: true
          description: Đề xuất lưu lý do duyệt/từ chối; schema tham chiếu dùng review_reason. Không có cột này trong Bảng 2.3 gốc.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventSummary:
      type: object
      description: Item trong danh sách tìm kiếm public, không có giá vé
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        title:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
    EventStatusResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        status:
          $ref: '#/components/schemas/EventStatus'
        rejectReason:
          type: string
          nullable: true
          description: Mapping events.review_reason, bổ sung kỹ thuật lưu kết quả duyệt.
        updatedAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          $ref: '#/components/schemas/ReviewDecision'
        reason:
          type: string
          nullable: true
          description: Bắt buộc khi decision = REJECT
    InternalEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        organizerId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/EventStatus'
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        title:
          type: string
          maxLength: 255
          description: Bổ sung kỹ thuật snapshot email ticket.issued, lấy events.title.
      required:
      - id
      - organizerId
      - title
      - status
      - startTime
      - endTime
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1
    EventSummaryPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/EventSummary'
    EventPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/EventResponse'
    CategoryRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        name:
          type: string
          example: Âm nhạc
    CategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique
          example: Âm nhạc
        description:
          type: string
          nullable: true
    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: EVENT_NOT_FOUND
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
x-source: BC_32_V2 §2.2–2.3 + xác nhận trực tiếp chủ dự án
x-implementation-status: scaffold-only
x-open-decisions: ../project-clarifications.md
