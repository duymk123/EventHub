openapi: 3.0.3
info:
  title: EventHub - Analytics Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng đối chiếu BC_32_V2, REST/Kafka/WebSocket đã triển khai ngày 2026-11-05, còn cấu hình identity và tích hợp producer của nhóm.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    ADMIN hoặc ORGANIZER sở hữu sự kiện, kiểm tra Event Service trước khi trả dữ liệu. Dashboard tổng gộp toàn sự kiện, sales report tách gộp/hoàn/thuần theo ngày Việt Nam. Doanh số nhận từ order.paid.
    Bổ sung 2026-11-13 (C10), analytics-service đã triển khai 2026-11-14: /analytics/overview và /analytics/events là thống kê gộp cho trang Phân tích: ADMIN xem mọi sự kiện, ORGANIZER chỉ sự kiện của mình (bổ sung 2026-11-14). Thiết kế chi tiết tại docs/plans/analytics-service.md §8.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Analytics
- name: AdminAnalytics
  description: 'Thống kê gộp (C10): ADMIN mọi sự kiện, ORGANIZER sự kiện của mình. Đã triển khai ở analytics-service 2026-11-14; cần Event INT-02 (/analytics/events) và INT-03 (phạm vi ORGANIZER).'
paths:
  /analytics/overview:
    get:
      tags:
      - AdminAnalytics
      operationId: getAnalyticsOverview
      summary: Tổng quan doanh thu, vé bán và khán giả theo ngày/tháng
      description: |-
        C10. Không có eventId: ADMIN nhận tổng toàn hệ thống; ORGANIZER nhận tổng các sự kiện mình sở hữu (Analytics lấy danh sách qua Event INT-03 GET /internal/events/ids?organizerId=, organizerId lấy từ JWT); CUSTOMER 403. Có eventId: cùng quyền với /analytics/events/{id}/sales (ADMIN hoặc ORGANIZER owner, xác minh qua Event Service).
        Kỳ báo cáo theo Asia/Ho_Chi_Minh: doanh thu/vé bán theo paidAt, hoàn tiền theo refundedAt (C09), khán giả theo attendance_state.checked_in_at (mỗi vé tính một lần).
        series được điền đủ mọi kỳ từ from..to (kỳ không có số liệu trả 0). previousTotals là khoảng liền trước có cùng số ngày, dùng hiển thị % thay đổi.
        ADMIN không có eventId thì không gọi Event Service. ORGANIZER chưa có sự kiện nào nhận series toàn 0.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: granularity
        in: query
        required: true
        description: DAY nhóm theo ngày (from..to tối đa 366 ngày); MONTH nhóm theo tháng dương lịch (tối đa 36 tháng).
        schema:
          $ref: '#/components/schemas/Granularity'
      - name: eventId
        in: query
        required: false
        description: Lọc một sự kiện; bỏ trống là toàn hệ thống.
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Số liệu tổng quan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
        '400':
          description: VALIDATION_ERROR (thiếu from/to/granularity, sai định dạng), INVALID_DATE_RANGE (from sau to) hoặc DATE_RANGE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN (CUSTOMER) hoặc FORBIDDEN_NOT_OWNER (eventId không thuộc ORGANIZER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: EVENT_NOT_FOUND (chỉ khi có eventId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: EVENT_SERVICE_UNAVAILABLE (khi có eventId, hoặc ORGANIZER cần lấy danh sách sự kiện của mình)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/events:
    get:
      tags:
      - AdminAnalytics
      operationId: listEventAnalytics
      summary: Bảng thống kê theo từng sự kiện
      description: |-
        C10. ADMIN thấy mọi sự kiện; ORGANIZER chỉ thấy sự kiện mình sở hữu (phạm vi lấy qua Event INT-03); CUSTOMER 403. Liệt kê sự kiện có phát sinh doanh thu, hoàn tiền hoặc check-in trong from..to, sắp xếp và phân trang tại server rồi mới bổ sung metadata cho đúng trang đó:
        title/status/startTime từ Event Service (GET /internal/events?ids=), capacity từ Ticket Service (GET /internal/ticket-types/capacity?eventIds=).
        Event Service lỗi trả 503 (không trả tên giả). Ticket Service lỗi vẫn trả 200 với capacity=null.
        validTicketsLifetime và attendeesLifetime không phụ thuộc from..to, dùng làm mẫu số tỉ lệ check-in để không vượt 100% khi vé bán trước khoảng lọc.
        Phân trang theo quy ước chung (page từ 0, size mặc định 20, tối đa 100, JSON via-dto).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: sort
        in: query
        required: false
        description: Trường sắp xếp giảm dần, tie-break theo eventId tăng dần. Mặc định netRevenue.
        schema:
          type: string
          enum:
          - netRevenue
          - grossRevenue
          - ticketsSold
          - attendees
          default: netRevenue
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Trang thống kê theo sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAnalyticsPage'
        '400':
          description: VALIDATION_ERROR, INVALID_DATE_RANGE hoặc DATE_RANGE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN (CUSTOMER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: EVENT_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/events/{id}/sales:
    get:
      tags:
      - Analytics
      operationId: getSalesReport
      summary: Báo cáo doanh số theo khoảng thời gian
      description: ADMIN hoặc ORGANIZER owner, xác minh sự kiện qua /internal/events/{id}. Sự kiện tồn tại chưa có projection trả 0; sự kiện không tồn tại 404, Event Service lỗi 503. from > to trả 400. Ngày theo Asia/Ho_Chi_Minh từ paidAt/refundedAt, công thức trong SalesReport.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      - name: from
        in: query
        description: Ngày bắt đầu (yyyy-MM-dd)
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Ngày kết thúc (yyyy-MM-dd)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Báo cáo doanh số
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '400':
          description: VALIDATION_ERROR (from sau to)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: EVENT_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/events/{id}/attendance:
    get:
      tags:
      - Analytics
      operationId: getAttendance
      summary: Số người đang có mặt
      description: ADMIN hoặc ORGANIZER owner, xác minh sự kiện qua /internal/events/{id}. Sự kiện tồn tại chưa có projection trả 0; sự kiện không tồn tại 404, Event Service lỗi 503.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Tình trạng điểm danh hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: EVENT_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analytics/events/{id}/dashboard:
    get:
      tags:
      - Analytics
      operationId: getDashboard
      summary: Snapshot ban đầu trước khi subscribe WS
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      description: Đề xuất kỹ thuật để tải trạng thái ban đầu; cùng quyền/DTO với WS. Không có dữ liệu trả 0, updatedAt=null sau khi xác minh sự kiện tồn tại.
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSnapshot'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN_NOT_OWNER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: EVENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: EVENT_SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  parameters:
    EventId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    From:
      name: from
      in: query
      required: true
      description: Ngày bắt đầu, bao gồm (yyyy-MM-dd, Asia/Ho_Chi_Minh)
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      required: true
      description: Ngày kết thúc, bao gồm (yyyy-MM-dd, Asia/Ho_Chi_Minh)
      schema:
        type: string
        format: date
  responses:
    Unauthorized:
      description: Thiếu hoặc sai JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không phải ORGANIZER của Event
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Granularity:
      type: string
      enum:
      - DAY
      - MONTH
    AnalyticsMetrics:
      type: object
      description: 'C10. grossRevenue/ticketsSold gộp theo paidAt; refundedAmount/ticketsRefunded theo refundedAt; netRevenue = grossRevenue - refundedAmount; attendees = số vé có checked_in_at trong khoảng (mỗi vé một lần, không trừ khi check-out).'
      required:
      - grossRevenue
      - refundedAmount
      - netRevenue
      - ticketsSold
      - ticketsRefunded
      - attendees
      properties:
        grossRevenue:
          type: number
          multipleOf: 0.01
        refundedAmount:
          type: number
          multipleOf: 0.01
        netRevenue:
          type: number
          multipleOf: 0.01
          description: Có thể âm trong một kỳ chỉ có hoàn tiền.
        ticketsSold:
          type: integer
          minimum: 0
        ticketsRefunded:
          type: integer
          minimum: 0
        attendees:
          type: integer
          minimum: 0
    AnalyticsSeriesPoint:
      allOf:
      - $ref: '#/components/schemas/AnalyticsMetrics'
      - type: object
        required:
        - period
        properties:
          period:
            type: string
            description: yyyy-MM-dd khi DAY, yyyy-MM khi MONTH. Kỳ đầu/cuối của MONTH chỉ tính phần ngày nằm trong from..to.
            example: '2026-11'
    TicketTypeTotals:
      type: object
      description: Gom theo tên hạng snapshot trên mọi sự kiện (ticket_type_id khác nhau giữa các sự kiện). ticketsSold là vé hợp lệ = bán - hoàn trong khoảng.
      required:
      - ticketTypeName
      - ticketsSold
      - netRevenue
      properties:
        ticketTypeName:
          type: string
          enum:
          - VIP
          - PREMIUM
          - STANDARD
        ticketsSold:
          type: integer
        netRevenue:
          type: number
          multipleOf: 0.01
    AnalyticsOverview:
      type: object
      required:
      - from
      - to
      - granularity
      - totals
      - previousFrom
      - previousTo
      - previousTotals
      - series
      - byTicketType
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        granularity:
          $ref: '#/components/schemas/Granularity'
        eventId:
          type: string
          format: uuid
          nullable: true
        totals:
          $ref: '#/components/schemas/AnalyticsMetrics'
        previousFrom:
          type: string
          format: date
        previousTo:
          type: string
          format: date
        previousTotals:
          $ref: '#/components/schemas/AnalyticsMetrics'
        series:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsSeriesPoint'
        byTicketType:
          type: array
          items:
            $ref: '#/components/schemas/TicketTypeTotals'
    EventAnalyticsRow:
      allOf:
      - $ref: '#/components/schemas/AnalyticsMetrics'
      - type: object
        required:
        - eventId
        - title
        - status
        - startTime
        - validTicketsLifetime
        - attendeesLifetime
        properties:
          eventId:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
          title:
            type: string
          status:
            type: string
            enum:
            - DRAFT
            - SUBMITTED
            - APPROVED
            - REJECTED
            - PUBLISHED
            - CLOSED
          startTime:
            type: string
            format: date-time
          capacity:
            type: integer
            nullable: true
            description: Tổng total_quota các hạng của sự kiện; null khi Ticket Service không phản hồi.
          validTicketsLifetime:
            type: integer
            description: dashboard_snapshot.total_tickets_sold - SUM(sales_metrics.tickets_refunded) toàn thời gian.
          attendeesLifetime:
            type: integer
            description: dashboard_snapshot.total_checked_in.
    EventAnalyticsPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EventAnalyticsRow'
        page:
          type: object
          required:
          - size
          - number
          - totalElements
          - totalPages
          properties:
            size:
              type: integer
            number:
              type: integer
            totalElements:
              type: integer
              format: int64
            totalPages:
              type: integer
    DailySales:
      type: object
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
          multipleOf: 0.01
        refundedAmount:
          type: number
          multipleOf: 0.01
        netRevenue:
          type: number
          multipleOf: 0.01
        ticketsSold:
          type: integer
          minimum: 0
        ticketsRefunded:
          type: integer
          minimum: 0
    SalesReport:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
        totalRevenue:
          type: number
          multipleOf: 0.01
        totalRefunded:
          type: number
          multipleOf: 0.01
        netRevenue:
          type: number
          multipleOf: 0.01
        totalTicketsSold:
          type: integer
          minimum: 0
        totalTicketsRefunded:
          type: integer
          minimum: 0
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailySales'
        byTicketType:
          type: array
          items:
            $ref: '#/components/schemas/TicketTypeSales'
      description: 'Xác nhận 2026-11-05. revenue/ticketsSold gộp, refund ghi ngày refundedAt, netRevenue = revenue - refundedAmount, ngày Asia/Ho_Chi_Minh. Thiếu from/to thì không giới hạn đầu tương ứng; trả nullable from/to phản ánh request.'
    Attendance:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        currentAttendance:
          type: integer
        updatedAt:
          type: string
          format: date-time
          nullable: true
        totalCheckedIn:
          type: integer
          minimum: 0
      description: 'Theo luồng V2 không tái nhập: tổng số vé từng check-in thành công, không đếm retry. currentAttendance đếm vé đã vào chưa ra; projection phải chịu đảo thứ tự Kafka.'
    DashboardSnapshot:
      type: object
      description: 'Payload WS và GET ban đầu. totalRevenue/totalTicketsSold là tổng gộp toàn sự kiện theo xác nhận 2026-11-05. Báo cáo sales hiển thị riêng hoàn tiền và số thuần. Khi chưa có dữ liệu trả 0 và updatedAt=null sau khi xác minh sự kiện.'
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        totalRevenue:
          type: number
          multipleOf: 0.01
        totalTicketsSold:
          type: integer
          description: Tổng số vé đã bán của toàn sự kiện, giữ nguyên khi hoàn tiền.
        currentAttendance:
          type: integer
          minimum: 0
        totalCheckedIn:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
    TicketTypeSales:
      type: object
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        ticketTypeName:
          type: string
          enum:
          - VIP
          - PREMIUM
          - STANDARD
        revenue:
          type: number
          multipleOf: 0.01
        refundedAmount:
          type: number
          multipleOf: 0.01
        netRevenue:
          type: number
          multipleOf: 0.01
        ticketsSold:
          type: integer
          minimum: 0
        ticketsRefunded:
          type: integer
          minimum: 0
x-source: BC_32_V2 §2.2–2.3 + xác nhận trực tiếp chủ dự án
x-implementation-status: implemented-pending-team-identity-and-producer-integration
x-open-decisions: ../project-clarifications.md
x-websocket:
  endpoint: /ws/dashboard
  gatewayRoute: ws://analytics-service:8080
  destination: /topic/event/{eventId}/dashboard
  protocol: STOMP
  authentication: JWT Keycloak trong CONNECT; kiểm tra expiry khi thao tác và giới hạn tuổi session; role/owner khi SUBSCRIBE; cấm client SEND tới topic server
  status: implemented-pending-team-identity-and-gateway-integration
