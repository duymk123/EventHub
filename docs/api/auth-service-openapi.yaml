openapi: 3.0.3
info:
  title: EventHub - Auth Service API
  version: 2.0.0-draft
  description: 'Hợp đồng mục tiêu BC_32_V2 + xác nhận 2026-10-27: giữ giao diện/API tài khoản riêng, Auth gọi Keycloak. Keycloak quản lý credentials, đăng nhập, cấp token và session; Auth không tự ký JWT hoặc lưu password_hash/refresh_tokens. Các endpoint dưới là facade EventHub, không phải endpoint tự cấp token. **Đã triển khai và chạy thật** (17 endpoint); realm/client/grant flow/role mapper/audience đã cấu hình trong `infrastructure/keycloak/eventhub-realm.json`. Access token TTL 300s, refresh token rotation bật. C13 (2026-11-22): refresh token chỉ đi trong cookie HttpOnly do Auth đặt (`eh_refresh`, SameSite=Strict, Path=/api/v1/auth, Secure khi HTTPS), không nằm trong body; frontend giữ access token trong bộ nhớ. (C13 đã triển khai 2026-11-24.) Mapping userId=sub UUID đã khớp realm (`registrationEmailAsUsername=true`). Profile lưu ở DB riêng của auth-service (`user_profiles`). Luồng chi tiết: `docs/architecture/auth-keycloak-flows.md`. Bộ test tay: `auth-service/postman/`.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Auth
- name: Admin - User
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: AUTH-UC01 Đăng ký
      description: Facade EventHub → Keycloak. Tạo tài khoản qua API Keycloak được cấp quyền, gán CUSTOMER; không lưu password hash local. Chính sách email verification cần cấu hình.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: AUTH-UC02 Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'C13: body chỉ có access token (AccessTokenResponse); refresh token nằm trong cookie HttpOnly eh_refresh.'
          headers:
            Set-Cookie:
              description: 'eh_refresh=<refresh token>; Max-Age=<refreshExpiresIn>; Path=/api/v1/auth; HttpOnly; SameSite=Strict (thêm Secure khi eventhub.auth.refresh-cookie.secure=true)'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            ACCOUNT_LOCKED (tài khoản bị ADMIN khoá) hoặc EMAIL_NOT_VERIFIED (đúng mật khẩu nhưng còn required
            action chưa hoàn tất, thường là chưa xác minh email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
      description: Facade EventHub → Keycloak. Xác thực tại Keycloak và trả token do Keycloak cấp, không ký token ứng dụng mới. UI riêng đã chốt; cách trao đổi credentials/code với Keycloak còn cấu hình, request draft không tự cho phép password grant.
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: AUTH-UC03 Refresh token (rotation)
      description: 'Facade EventHub → Keycloak. Đổi refresh token lấy cặp token mới ở Keycloak (xoay vòng: refresh token cũ hết hiệu lực). Frontend gọi khi access token hết hạn (401), gộp các request đang chờ thành một lần refresh. Không đọc/ghi bảng refresh_tokens riêng. C13: không có body, đọc refresh token từ cookie eh_refresh (thiếu cookie → 401 INVALID_REFRESH_TOKEN); thành công ghi cookie mới (xoay vòng), lỗi thì xóa cookie. Tải lại trang, frontend gọi endpoint này để lấy lại access token.'
      parameters:
      - name: eh_refresh
        in: cookie
        required: false
        description: Refresh token do Auth đặt ở login/refresh (HttpOnly, frontend không đọc được). Gọi với credentials include.
        schema:
          type: string
      responses:
        '200':
          description: Access token mới (AccessTokenResponse), cookie eh_refresh được thay bằng refresh token mới.
          headers:
            Set-Cookie:
              description: 'eh_refresh=<refresh token>; Max-Age=<refreshExpiresIn>; Path=/api/v1/auth; HttpOnly; SameSite=Strict (thêm Secure khi eventhub.auth.refresh-cookie.secure=true)'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: |
            INVALID_REFRESH_TOKEN, REFRESH_TOKEN_EXPIRED hoặc REFRESH_TOKEN_REUSED
            (reuse thì toàn bộ token family bị thu hồi). Cookie eh_refresh bị xóa (Max-Age=0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: AUTH-UC04 Đăng xuất
      description: 'Facade EventHub → Keycloak. Kết thúc session ở Keycloak bằng refresh token. Access token đã cấp vẫn còn hạn tối đa 5 phút; frontend tự bỏ token trong bộ nhớ. C13: không có body, đọc cookie eh_refresh; lỗi phía Keycloak hoặc thiếu cookie đều bỏ qua, luôn xóa cookie (Max-Age=0) và trả 204.'
      parameters:
      - name: eh_refresh
        in: cookie
        required: false
        description: Refresh token do Auth đặt ở login/refresh (HttpOnly, frontend không đọc được). Gọi với credentials include.
        schema:
          type: string
      responses:
        '204':
          description: Đăng xuất thành công, cookie eh_refresh đã bị xóa.
      x-contract-status: implemented
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: AUTH-UC05 Thông tin tài khoản hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-contract-status: implemented
      description: Facade EventHub → Keycloak. Đọc identity/profile đã xác minh từ Keycloak/adapter; không giả định claim roles phẳng hoặc có DB users local.
  /auth/verify-email/resend:
    post:
      tags:
      - Auth
      operationId: resendVerificationEmail
      summary: Gửi lại mail xác minh email
      description: Keycloak gửi mail (dev qua Mailpit). Sau khi bấm link, client gọi /auth/refresh để nhận token có email_verified=true; Order chỉ cho đặt vé khi email đã xác minh.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Đã gửi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: EMAIL_ALREADY_VERIFIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: TOO_MANY_REQUESTS (đã gửi mail cho email này quá số lần cho phép trong cửa sổ hiện tại)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AUTH_PROVIDER_UNAVAILABLE (Keycloak hoặc SMTP lỗi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/profile:
    get:
      tags:
      - Auth
      operationId: getMyProfile
      summary: Hồ sơ nghiệp vụ của tôi
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Hồ sơ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: PROFILE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Auth
      operationId: initializeMyProfile
      summary: Tạo hồ sơ cho tài khoản chưa có (tài khoản tạo ngoài /auth/register)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: PROFILE_ALREADY_EXISTS hoặc PHONE_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Auth
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ (chỉ trường được gửi; phoneNumber rỗng để xóa)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
      responses:
        '200':
          description: Hồ sơ sau cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: PROFILE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PHONE_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/change-password:
    post:
      tags:
      - Auth
      operationId: changePassword
      summary: AUTH-UC06 Đổi mật khẩu
      description: Facade EventHub → Keycloak. Đổi mật khẩu qua API/flow Keycloak được cấp quyền, không tự so hash local; kiểm tra current password theo flow được cấu hình.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công
        '400':
          description: VALIDATION_ERROR (gồm mật khẩu mới không đạt chính sách realm) hoặc CURRENT_PASSWORD_INCORRECT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-contract-status: implemented
  /admin/users/{userId}/lock:
    patch:
      tags:
      - Admin - User
      operationId: lockUser
      summary: AUTH-UC08 Khóa tài khoản
      description: Facade EventHub → Keycloak. ADMIN yêu cầu Keycloak disable user/thu hồi session theo chính sách. Không hứa mọi JWT đã phát mất hiệu lực tức thì nếu resource server chỉ verify offline.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_LOCKED hoặc CANNOT_MODIFY_OWN_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
  /admin/users/{userId}/unlock:
    patch:
      tags:
      - Admin - User
      operationId: unlockUser
      summary: AUTH-UC09 Mở khóa tài khoản
      description: Facade EventHub → Keycloak. ADMIN yêu cầu Keycloak enable user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã mở khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_ACTIVE hoặc CANNOT_MODIFY_OWN_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
  /admin/users/{userId}/role:
    patch:
      tags:
      - Admin - User
      operationId: assignRole
      summary: AUTH-UC07 Gán / chuyển role
      description: Facade EventHub → Keycloak. ADMIN chuyển vai trò nghiệp vụ CUSTOMER/ORGANIZER/ADMIN qua Keycloak role mapping, không users_roles local.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '204':
          description: Đã cập nhật role (gỡ business role cũ, gán role mới; người dùng nhận role mới ở lần refresh tiếp theo)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: CANNOT_MODIFY_OWN_ACCOUNT (ADMIN tự đổi role mình) hoặc ROLE_MAPPING_CONFLICT (user vẫn thừa kế business role khác từ composite role của realm)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: implemented
  /auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: forgotPassword
      summary: AUTH-UC07 Quên mật khẩu
      description: |
        Tìm user theo email chính xác rồi nhờ Keycloak gửi mail đặt lại mật khẩu.
        **Luôn trả 204** dù email có tồn tại hay không (chống dò tài khoản). Tài khoản `enabled=false`
        cũng trả 204 nhưng không gửi mail.

        Link trong mail trỏ thẳng tới Keycloak (`KC_HOSTNAME`), Keycloak tự dựng form đặt mật khẩu.
        Auth Service **không** mở endpoint nhận reset token — xem §8 trong `auth-keycloak-flows.md`.

        **Giới hạn tần suất:** mỗi email nhận tối đa 3 mail trong 15 phút
        (`eventhub.auth.email-rate-limit.*`). Vượt hạn mức vẫn trả **204** và không gửi mail —
        cố ý, để kẻ tấn công không phân biệt được email tồn tại hay vừa bị chặn.

        **Không gắn `requiredActions` trước khi gửi.** Nếu gắn, bất kỳ ai biết email cũng đặt được
        tài khoản người khác vào trạng thái "chưa hoàn tất thiết lập", khiến họ không đăng nhập được
        dù mật khẩu đúng. `execute-actions-email` đã mang sẵn action trong link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Đã xử lý (luôn 204, kể cả email không tồn tại)
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented
  /auth/me/sessions:
    get:
      tags:
      - Auth
      operationId: getMySessions
      summary: Danh sách phiên đăng nhập của chính mình
      description: Các phiên còn hiệu lực của user đang đăng nhập, đọc từ Keycloak.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách phiên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented
  /auth/me/sessions/{sessionId}:
    delete:
      tags:
      - Auth
      operationId: revokeMySession
      summary: Thu hồi một phiên của chính mình
      description: |
        Chỉ thu hồi được phiên thuộc về người gọi; phiên của người khác trả 404 để không lộ sự tồn tại.
        Access token đã cấp vẫn dùng được tới khi hết hạn (5 phút).
      security:
      - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          example: ScX2A4mz5dpG7VLEyhFSDZbR
      responses:
        '204':
          description: Đã thu hồi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: USER_NOT_FOUND — message "Session not found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented
  /admin/users:
    get:
      tags:
      - Admin - User
      operationId: listUsers
      summary: ADMIN-UC01 Danh sách user (phân trang + lọc)
      description: |
        Chỉ ADMIN (`SecurityConfig` chặn `/api/v1/admin/**` bằng `hasRole("ADMIN")`).

        - `search` đẩy xuống Keycloak (khớp email/họ tên/username).
        - `role` và `status` không lọc được bằng query param của Keycloak nên Auth Service duyệt theo lô,
          tối đa 2000 bản ghi mỗi truy vấn; vượt trần thì ghi log WARN và trả kết quả một phần.
        - Tham số rác được chuẩn hóa thay vì trả lỗi: `page` âm → 0, `size` > 100 → 100, `status` lạ → bỏ qua.
      security:
      - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Số trang, bắt đầu từ 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Tìm theo email / họ tên / username
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Một trang user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfUserDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented
  /admin/users/{userId}:
    get:
      tags:
      - Admin - User
      operationId: getUserDetail
      summary: ADMIN-UC02 Chi tiết user
      description: |
        Chi tiết tài khoản cho trang quản trị, gồm `requiredActions` (các bước Keycloak đang bắt user hoàn tất).
        **Không có `lastLoginAt`** — Keycloak Admin API không trả về thời điểm đăng nhập cuối.
      security:
      - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Chi tiết user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented
  /admin/users/{userId}/reset-password:
    post:
      tags:
      - Admin - User
      operationId: adminResetPassword
      summary: ADMIN-UC06 Đặt lại mật khẩu của user khác
      description: |
        - `SEND_EMAIL`: Keycloak gửi mail chứa link đặt mật khẩu. `temporaryPassword` = null.
        - `SET_TEMPORARY_PASSWORD`: Auth Service sinh mật khẩu tạm 16 ký tự (SecureRandom, đủ 4 nhóm ký tự,
          loại ký tự dễ nhầm 0/O/1/l/I), đặt ở chế độ `temporary: true` và thu hồi toàn bộ phiên cũ.
          Mật khẩu **chỉ trả đúng một lần**, không lưu DB, không ghi log.

        ADMIN không được thao tác trên chính mình.
      security:
      - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: Đã xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPasswordResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: CANNOT_MODIFY_OWN_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
      x-contract-status: implemented

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền (không phải ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: AUTH_PROVIDER_UNAVAILABLE — không gọi được Keycloak
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum:
      - CUSTOMER
      - ORGANIZER
      - ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
          maxLength: 100
          example: Nguyễn Văn A
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
          description: Không bắt buộc; trùng với tài khoản khác trả 409 PHONE_ALREADY_EXISTS.
          example: '0901234567'
    AccessTokenResponse:
      type: object
      description: C13. Refresh token không nằm trong body mà trong cookie HttpOnly eh_refresh.
      properties:
        accessToken:
          type: string
          description: Access token do Keycloak cấp; frontend chỉ giữ trong bộ nhớ.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: TTL access token thực tế từ Keycloak, giây (realm hiện đặt 300). Frontend dùng để hẹn refresh, không hardcode.
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: Request facade draft cho UI riêng. Nếu chọn code exchange thay vì gửi password thì phải cập nhật schema; chưa tự bật Direct Access Grants. Keycloak là nơi xác thực.
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    AssignRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
          description: false tới khi người dùng bấm link trong mail xác minh; Order chỉ cho đặt vé khi true.
        createdAt:
          type: string
          format: date-time
      description: DTO facade; id UUID nghiệp vụ đề xuất map Keycloak sub. role/status là mapping của Keycloak, không là bảng users local.
    UserProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
          description: Bắt buộc với PUT
        phoneNumber:
          type: string
          maxLength: 20
          nullable: true
        avatarUrl:
          type: string
          maxLength: 255
          nullable: true
    UserProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        keycloakSub:
          type: string
          format: uuid
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    PageOfUserDetailResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDetailResponse'
        page:
          type: integer
          description: Số trang, bắt đầu từ 0
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Tổng số bản ghi khớp điều kiện (không phải số bản ghi trong trang)
          example: 8
        totalPages:
          type: integer
          example: 1
    UserDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        requiredActions:
          type: array
          items:
            type: string
          description: Các bước Keycloak đang bắt user hoàn tất; rỗng nghĩa là không còn bước nào chờ
          example: ["UPDATE_PASSWORD"]
        createdAt:
          type: string
          format: date-time
      description: DTO trang quản trị. Không có lastLoginAt — Keycloak Admin API không cung cấp.
    AdminResetPasswordRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - SEND_EMAIL
          - SET_TEMPORARY_PASSWORD
    TemporaryPasswordResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        temporaryPassword:
          type: string
          nullable: true
          description: |
            Chỉ có giá trị khi action=SET_TEMPORARY_PASSWORD. Trả đúng một lần, không lưu DB, không ghi log.
            null khi action=SEND_EMAIL.
    SessionResponse:
      type: object
      properties:
        id:
          type: string
          description: Dùng cho DELETE /auth/me/sessions/{sessionId}
          example: ScX2A4mz5dpG7VLEyhFSDZbR
        ipAddress:
          type: string
          nullable: true
          example: 172.20.0.1
        startedAt:
          type: string
          format: date-time
        lastAccessAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
