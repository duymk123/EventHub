openapi: 3.0.3
info:
  title: EventHub - Auth Service API
  version: 2.0.0-draft
  description: 'Hợp đồng mục tiêu BC_32_V2 + xác nhận 2026-10-27: giữ giao diện/API tài khoản riêng, Auth gọi Keycloak. Keycloak quản lý credentials, đăng nhập, cấp token và session; Auth không tự ký JWT hoặc lưu password_hash/refresh_tokens. Các endpoint dưới là facade EventHub, không phải endpoint tự cấp token. Repo hiện là scaffold, chưa triển khai. Realm/client, grant flow, issuer/audience/JWK, role mapper, admin/service-account permissions và S2S còn chờ cấu hình; không mặc định password grant hoặc TTL. Mapping userId=sub UUID là đề xuất kỹ thuật cần khớp realm; DB profile nếu cần sẽ thiết kế riêng.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Auth
  description: Public authentication endpoints (no admin role required)
- name: Auth - User Self-Service
  description: User managing their own account (requires valid access token)
- name: Admin - User Management
  description: Admin-only endpoints for managing other users (requires ADMIN role)
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: AUTH-UC01 Đăng ký tài khoản
      description: |-
        Facade EventHub → Keycloak. Tạo tài khoản qua Admin API Keycloak được cấp quyền, gán realm role CUSTOMER; không lưu password hash local. Chính sách email verification cần cấu hình realm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: AUTH-UC02 Đăng nhập
      description: |-
        Facade EventHub → Keycloak. Xác thực tại Keycloak theo grant flow được cấu hình (password/code exchange) và trả token do Keycloak cấp, không ký token ứng dụng mới. UI riêng đã chốt; cách trao đổi credentials/code với Keycloak còn cấu hình.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Cấp access token và refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: AUTH-UC03 Refresh token (rotation)
      description: |-
        Facade EventHub → Keycloak. Ủy quyền refresh cho Keycloak, không đọc/ghi bảng refresh_tokens riêng. Chính sách rotation/reuse thuộc cấu hình Keycloak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |-
            INVALID_REFRESH_TOKEN, REFRESH_TOKEN_EXPIRED hoặc REFRESH_TOKEN_REUSED
            (reuse thì toàn bộ token family bị thu hồi theo chính sách Keycloak).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: AUTH-UC04 Đăng xuất
      description: |-
        Facade EventHub → Keycloak. Kết thúc/revoke session qua Keycloak theo client integration (logout endpoint hoặc Admin API revoke); không chỉ xóa refresh token local. Hiệu lực của access token đang tồn tại còn tùy cấu hình thu hồi/quyền resource server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          description: INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: AUTH-UC05 Thông tin tài khoản hiện tại
      description: |-
        Facade EventHub → Keycloak. Đọc identity/profile đã xác minh từ Keycloak/adapter (UserInfo endpoint hoặc Admin API); trả `UserResponse(id=sub, email, fullName, role, status, createdAt)` từ Keycloak. Không nhận userId khác trong query. Không trả dữ liệu từ `user_profiles`.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/change-password:
    post:
      tags:
      - Auth - User Self-Service
      operationId: changePassword
      summary: AUTH-UC06 Đổi mật khẩu (user tự đổi)
      description: |-
        Facade EventHub → Keycloak. Đổi mật khẩu qua Account API hoặc Admin API Keycloak được cấp quyền, không tự so hash local; kiểm tra current password theo flow được cấu hình (verify credential).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công
        '400':
          description: VALIDATION_ERROR hoặc CURRENT_PASSWORD_INCORRECT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: forgotPassword
      summary: AUTH-UC10 Yêu cầu reset mật khẩu (quên mật khẩu)
      description: |-
        Facade EventHub → Keycloak. Gọi Keycloak Admin API hoặc Account API gửi email reset password tới user. Không xác thực access token (public endpoint). Keycloak tự xử lý token reset, link, expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Email reset đã gửi (trả 204 dù email không tồn tại để tránh enum)
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/reset-password:
    post:
      tags:
      - Auth
      operationId: resetPassword
      summary: AUTH-UC11 Đặt lại mật khẩu bằng token từ email
      description: |-
        Facade EventHub → Keycloak. User submit mật khẩu mới kèm reset token nhận được qua email. Gọi Keycloak Admin API (`PUT /users/{id}/reset-password`) hoặc Account API. Không yêu cầu access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Đặt lại mật khẩu thành công
        '400':
          description: VALIDATION_ERROR, RESET_TOKEN_INVALID hoặc RESET_TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/verify-email:
    post:
      tags:
      - Auth
      operationId: verifyEmail
      summary: AUTH-UC12 Xác thực email bằng token
      description: |-
        Facade EventHub → Keycloak. User click link verify email → FE gọi endpoint này với token → proxy Keycloak verify. Không yêu cầu access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email đã được xác thực
        '400':
          description: VALIDATION_ERROR, VERIFICATION_TOKEN_INVALID hoặc VERIFICATION_TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/resend-verification:
    post:
      tags:
      - Auth
      operationId: resendVerification
      summary: AUTH-UC13 Gửi lại email xác thực
      description: |-
        Facade EventHub → Keycloak. Gọi Keycloak Admin API gửi lại email verify. Không yêu cầu access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '204':
          description: Email verify đã gửi lại (trả 204 dù email không tồn tại)
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/me/sessions:
    get:
      tags:
      - Auth - User Self-Service
      operationId: getMySessions
      summary: AUTH-UC14 Xem session hoạt động của mình
      description: |-
        Facade EventHub → Keycloak. Gọi Admin API `GET /users/{id}/sessions` hoặc introspect endpoint để lấy danh sách session/device đang đăng nhập của user hiện tại.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Danh sách session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/me/sessions/{sessionId}:
    delete:
      tags:
      - Auth - User Self-Service
      operationId: revokeMySession
      summary: AUTH-UC15 Đăng xuất một session cụ thể (revoke)
      description: |-
        Facade EventHub → Keycloak. Gọi Admin API `DELETE /users/{id}/sessions/{sessionId}` để revoke một session cụ thể (thiết bị khác).
      security:
      - bearerAuth: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Đã revoke session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: SESSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users:
    get:
      tags:
      - Admin - User Management
      operationId: listUsers
      summary: AUTH-UC07 Danh sách user (phân trang, tìm kiếm, lọc)
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN lấy danh sách user từ Keycloak với phân trang, tìm kiếm theo email/username/fullName, lọc theo role, status. Map về DTO EventHub.
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        schema:
          type: string
          default: createdAt,desc
      - name: search
        in: query
        schema:
          type: string
          description: Tìm kiếm email, username, fullName
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/Role'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: Danh sách user phân trang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}:
    get:
      tags:
      - Admin - User Management
      operationId: getUserDetail
      summary: AUTH-UC08 Xem chi tiết user
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN xem chi tiết user: profile + role + status + timestamps + emailVerified + lastLoginAt.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Chi tiết user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/lock:
    patch:
      tags:
      - Admin - User Management
      operationId: lockUser
      summary: AUTH-UC09 Khóa tài khoản (disable + revoke sessions)
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN yêu cầu Keycloak disable user (`enabled=false`) và revoke tất cả session. Idempotent. Không hứa mọi JWT đã phát mất hiệu lực tức thì nếu resource server chỉ verify offline.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/unlock:
    patch:
      tags:
      - Admin - User Management
      operationId: unlockUser
      summary: AUTH-UC10 Mở khóa tài khoản
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN yêu cầu Keycloak enable user (`enabled=true`). Idempotent. 404 nếu không tồn tại.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã mở khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/role:
    patch:
      tags:
      - Admin - User Management
      operationId: assignRole
      summary: AUTH-UC11 Gán / chuyển role nghiệp vụ
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN chuyển đúng một business role CUSTOMER/ORGANIZER/ADMIN qua realm role mappings, không users_roles local. Cần xử lý trạng thái trung gian nếu provider cần nhiều request. Retry phải hội tụ về một business role, fail closed nếu mapping mơ hồ.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '204':
          description: Đã cập nhật role
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/reset-password:
    post:
      tags:
      - Admin - User Management
      operationId: adminResetPassword
      summary: AUTH-UC12 Reset mật khẩu bởi admin
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN đặt lại mật khẩu cho user khác: gửi email reset hoặc set temporary password qua `PUT /users/{id}/reset-password` (type=password) hoặc `execute-actions-email` (UPDATE_PASSWORD). Không trả password trong response.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '204':
          description: Đã thực hiện reset (gửi email hoặc set temporary password)
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/sessions:
    get:
      tags:
      - Admin - User Management
      operationId: getUserSessions
      summary: AUTH-UC13 Xem session hoạt động của user
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN xem danh sách session/device đang đăng nhập của user bất kỳ: `GET /users/{id}/sessions`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Danh sách session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/sessions:
    delete:
      tags:
      - Admin - User Management
      operationId: revokeAllUserSessions
      summary: AUTH-UC14 Đăng xuất tất cả session của user (revoke all)
      description: |-
        Facade EventHub → Keycloak Admin API. ADMIN revoke toàn bộ session của user: `DELETE /users/{id}/sessions`. Force logout mọi thiết bị.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã revoke tất cả session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền (không phải ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum:
      - CUSTOMER
      - ORGANIZER
      - ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
          example: Nguyễn Văn A
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: Request facade draft cho UI riêng. Nếu chọn code exchange thay vì gửi password thì phải cập nhật schema; chưa tự bật Direct Access Grants. Keycloak là nơi xác thực.
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
      - resetToken
      - newPassword
      properties:
        resetToken:
          type: string
          description: Token nhận được qua email reset password
        newPassword:
          type: string
          format: password
          minLength: 8
    VerifyEmailRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: Verification token từ email
    ResendVerificationRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    AssignRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    AdminResetPasswordRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - SEND_EMAIL
          - SET_TEMPORARY_PASSWORD
          description: SEND_EMAIL: gửi email reset; SET_TEMPORARY_PASSWORD: đặt temporary password và trả về trong response (chỉ khi cần)
        temporaryPassword:
          type: string
          description: Chỉ dùng khi action=SET_TEMPORARY_PASSWORD; nếu không cung cấp, Keycloak tự sinh
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token do Keycloak cấp; sub/role/issuer/audience theo mapping được cấu hình, Auth không tự ký.
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: TTL thực tế từ Keycloak, giây; không hardcode 5/15 phút.
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
      description: DTO facade; id UUID nghiệp vụ đề xuất map Keycloak sub. role/status là mapping của Keycloak, không là bảng users local.
    UserDetailResponse:
      allOf:
      - $ref: '#/components/schemas/UserResponse'
      - type: object
        properties:
          emailVerified:
            type: boolean
            description: Email đã được xác thực
          lastLoginAt:
            type: string
            format: date-time
            description: Lần đăng nhập gần nhất (từ Keycloak)
          username:
            type: string
            description: Username Keycloak (nếu khác email)
    PageUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: object
          properties:
            size:
              type: integer
            number:
              type: integer
            totalElements:
              type: integer
            totalPages:
              type: integer
    UserSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Session ID Keycloak
              startedAt:
                type: string
                format: date-time
              lastAccessedAt:
                type: string
                format: date-time
              ipAddress:
                type: string
              userAgent:
                type: string
              device:
                type: string
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
