openapi: 3.0.3
info:
  title: EventHub - Auth Service API
  version: 1.0.0
  description: |
    API contract của auth-service. Endpoint lấy từ spec Notion; request/response được suy ra từ use case và sequence diagram.

    - Role: `CUSTOMER` (mặc định khi đăng ký), `ORGANIZER`, `ADMIN`. Chỉ ADMIN được gán role.
    - Trạng thái user: `ACTIVE`, `LOCKED`. Tài khoản LOCKED không login và không refresh được.
    - Access token (JWT: sub, roles, iat, exp): 5 phút. Refresh token: 7 ngày.
    - Refresh token rotation + reuse detection: token cũ đã revoked mà bị dùng lại thì thu hồi cả token family.
    - `refresh` và `logout` không cần access token, nhưng phải có refresh token hợp lệ trong body.
servers:
  - url: http://localhost:8080/api/v1
    description: API Gateway (local)

tags:
  - name: Auth
  - name: Admin - User

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: AUTH-UC01 Đăng ký
      description: Role mặc định CUSTOMER, status ACTIVE. Client không được gửi `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: AUTH-UC02 Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Cấp access token và refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: AUTH-UC03 Refresh token (rotation)
      description: Thu hồi refresh token cũ, cấp cặp token mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            INVALID_REFRESH_TOKEN, REFRESH_TOKEN_EXPIRED hoặc REFRESH_TOKEN_REUSED
            (reuse thì toàn bộ token family bị thu hồi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: AUTH-UC04 Đăng xuất
      description: Thu hồi refresh token. Phiên bản này không blacklist access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          description: INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: AUTH-UC05 Thông tin tài khoản hiện tại
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: AUTH-UC06 Đổi mật khẩu
      description: Sau khi đổi, toàn bộ refresh token của user bị thu hồi.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công
        '400':
          description: VALIDATION_ERROR hoặc CURRENT_PASSWORD_INCORRECT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/users/{userId}/lock:
    patch:
      tags: [Admin - User]
      operationId: lockUser
      summary: AUTH-UC08 Khóa tài khoản
      description: Role ADMIN. Chuyển status sang LOCKED và thu hồi toàn bộ refresh token của user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}/unlock:
    patch:
      tags: [Admin - User]
      operationId: unlockUser
      summary: AUTH-UC09 Mở khóa tài khoản
      description: Role ADMIN. Chuyển status sang ACTIVE.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã mở khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{userId}/role:
    patch:
      tags: [Admin - User]
      operationId: assignRole
      summary: AUTH-UC07 Gán / chuyển role
      description: Role ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '204':
          description: Đã cập nhật role
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền (không phải ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Role:
      type: string
      enum: [CUSTOMER, ORGANIZER, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, LOCKED]

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
          example: Nguyễn Văn A

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    AssignRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 'JWT: sub=userId, roles, iat, exp'
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Thời gian sống của access token (giây)
          example: 300

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
        timestamp:
          type: string
          format: date-time
