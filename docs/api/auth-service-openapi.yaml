openapi: 3.0.3
info:
  title: EventHub - Auth Service API
  version: 2.0.0-draft
  description: 'Hợp đồng mục tiêu BC_32_V2 + xác nhận 2026-10-27: giữ giao diện/API tài khoản riêng, Auth gọi Keycloak. Keycloak quản lý credentials, đăng nhập, cấp token và session; Auth không tự ký JWT hoặc lưu password_hash/refresh_tokens. Các endpoint dưới là facade EventHub, không phải endpoint tự cấp token. Repo hiện là scaffold, chưa triển khai. Realm/client, grant flow, issuer/audience/JWK, role mapper, admin/service-account permissions và S2S còn chờ cấu hình; không mặc định password grant hoặc TTL. Mapping userId=sub UUID là đề xuất kỹ thuật cần khớp realm; DB profile nếu cần sẽ thiết kế riêng.'
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Auth
- name: Admin - User
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: AUTH-UC01 Đăng ký
      description: Facade EventHub → Keycloak. Tạo tài khoản qua API Keycloak được cấp quyền, gán CUSTOMER; không lưu password hash local. Chính sách email verification cần cấu hình.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: EMAIL_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: AUTH-UC02 Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Cấp access token và refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
      description: Facade EventHub → Keycloak. Xác thực tại Keycloak và trả token do Keycloak cấp, không ký token ứng dụng mới. UI riêng đã chốt; cách trao đổi credentials/code với Keycloak còn cấu hình, request draft không tự cho phép password grant.
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: AUTH-UC03 Refresh token (rotation)
      description: Facade EventHub → Keycloak. Ủy quyền refresh cho Keycloak, không đọc/ghi bảng refresh_tokens riêng. Chính sách rotation/reuse thuộc cấu hình Keycloak.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            INVALID_REFRESH_TOKEN, REFRESH_TOKEN_EXPIRED hoặc REFRESH_TOKEN_REUSED
            (reuse thì toàn bộ token family bị thu hồi).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: AUTH-UC04 Đăng xuất
      description: Facade EventHub → Keycloak. Kết thúc/revoke session qua Keycloak theo client integration; không chỉ xóa refresh token local. Hiệu lực của access token đang tồn tại còn cấu hình thu hồi/quyền.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          description: INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: AUTH-UC05 Thông tin tài khoản hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-contract-status: target-facade-keycloak-integration-pending
      description: Facade EventHub → Keycloak. Đọc identity/profile đã xác minh từ Keycloak/adapter; không giả định claim roles phẳng hoặc có DB users local.
  /auth/change-password:
    post:
      tags:
      - Auth
      operationId: changePassword
      summary: AUTH-UC06 Đổi mật khẩu
      description: Facade EventHub → Keycloak. Đổi mật khẩu qua API/flow Keycloak được cấp quyền, không tự so hash local; kiểm tra current password theo flow được cấu hình.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công
        '400':
          description: VALIDATION_ERROR hoặc CURRENT_PASSWORD_INCORRECT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/lock:
    patch:
      tags:
      - Admin - User
      operationId: lockUser
      summary: AUTH-UC08 Khóa tài khoản
      description: Facade EventHub → Keycloak. ADMIN yêu cầu Keycloak disable user/thu hồi session theo chính sách. Không hứa mọi JWT đã phát mất hiệu lực tức thì nếu resource server chỉ verify offline.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/unlock:
    patch:
      tags:
      - Admin - User
      operationId: unlockUser
      summary: AUTH-UC09 Mở khóa tài khoản
      description: Facade EventHub → Keycloak. ADMIN yêu cầu Keycloak enable user.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Đã mở khóa
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: ACCOUNT_ALREADY_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: target-facade-keycloak-integration-pending
  /admin/users/{userId}/role:
    patch:
      tags:
      - Admin - User
      operationId: assignRole
      summary: AUTH-UC07 Gán / chuyển role
      description: Facade EventHub → Keycloak. ADMIN chuyển vai trò nghiệp vụ CUSTOMER/ORGANIZER/ADMIN qua Keycloak role mapping, không users_roles local.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '204':
          description: Đã cập nhật role
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
      x-contract-status: target-facade-keycloak-integration-pending
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền (không phải ADMIN)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: USER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Role:
      type: string
      enum:
      - CUSTOMER
      - ORGANIZER
      - ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
          example: Nguyễn Văn A
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      description: Request facade draft cho UI riêng. Nếu chọn code exchange thay vì gửi password thì phải cập nhật schema; chưa tự bật Direct Access Grants. Keycloak là nơi xác thực.
    RefreshRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
    AssignRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token do Keycloak cấp; sub/role/issuer/audience theo mapping được cấu hình, Auth không tự ký.
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: TTL thực tế từ Keycloak, giây; không hardcode 5/15 phút.
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
      description: DTO facade; id UUID nghiệp vụ đề xuất map Keycloak sub. role/status là mapping của Keycloak, không là bảng users local.
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
x-source: BC_32_V2 §2.2–2.3 + xác nhận trực tiếp chủ dự án
x-implementation-status: scaffold-only
x-open-decisions: ../project-clarifications.md
x-oidc-discovery: '{keycloak-base-url}/realms/{realm}/.well-known/openid-configuration'
x-integration-proposal: Không dùng đồng thời flow tự cấp JWT cũ. Cơ chế trao đổi credentials/code với Keycloak phải chọn khi cấu hình realm/client; không tự bật Direct Access Grants.
x-integration-decision: UI/API tài khoản EventHub riêng, Auth gọi Keycloak; chủ dự án đã chọn.
