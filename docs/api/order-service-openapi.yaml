openapi: 3.0.3
info:
  title: EventHub - Order Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng mục tiêu đối chiếu BC_32_V2 và xác nhận chủ dự án ngày 2026-10-27. Mã nguồn hiện là scaffold, chưa có endpoint nghiệp vụ.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    Bảng V2 bổ sung order_holders và payment_webhooks. Order sinh ID, reserve trước rồi lưu; reservationId NOT NULL. Tiền provider chưa chốt C06, hoàn tiền C04/C05, email C02.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Order
- name: Payment
- name: Refund
- name: Admin - Refund
paths:
  /orders:
    post:
      tags:
      - Order
      operationId: createOrder
      summary: Tạo Order và reserve vé
      description: 'Hình 2.57: sinh orderId UUID → Ticket reserve → dùng giá/hạn chính thức → lưu orders/items/holders trong transaction. Nếu lưu lỗi sau reserve thì release bù trừ. Không nhận giá/tổng tiền/customerId từ client.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: INSUFFICIENT_TICKETS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/me:
    get:
      tags:
      - Order
      operationId: getMyOrders
      summary: Lịch sử Order của tôi
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        description: 'Sắp xếp theo field,direction; có thể truyền lặp lại để sắp xếp nhiều trường. Mặc định createdAt,desc rồi id,desc.'
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Danh sách Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      tags:
      - Order
      operationId: getOrder
      summary: Chi tiết Order
      description: Chỉ xem được Order thuộc quyền sở hữu.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Chi tiết Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
  /orders/{id}/payment:
    post:
      tags:
      - Payment
      operationId: initPayment
      summary: Khởi tạo thanh toán
      description: Chỉ khi Order PENDING_PAYMENT và chưa quá `expiresAt`. Tạo hoặc đọc Payment theo `idempotency_key`.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: 'Đề xuất kỹ thuật: key ổn định cho retry cùng yêu cầu; tái sử dụng khác payload trả 409.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitPaymentRequest'
      responses:
        '200':
          description: Thông tin để khách thanh toán với gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: ORDER_NOT_PAYABLE hoặc ORDER_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/webhook/{provider}:
    post:
      tags:
      - Payment
      operationId: paymentWebhook
      summary: Payment webhook (gateway gọi)
      description: Nhận wire format đúng provider (C06), xác minh chữ ký trên request gốc, đối chiếu order/transaction/amount/currency trước xử lý. Dedup UNIQUE(provider,providerEventId), cùng key khác payload phải đối soát. CAS PENDING_PAYMENT → PAID rồi confirm Ticket; ACK không thay thế job retry confirm. Thành công tới sau EXPIRED không phát vé; cách hoàn/đối soát chờ C06.
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      requestBody:
        description: Wire format/chữ ký chờ chọn provider C06; không áp JSON DTO chuẩn hóa cho provider thật.
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Đã tiếp nhận (kể cả webhook lặp)
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: provider-wire-contract-pending-C06
  /orders/{id}/refunds:
    post:
      tags:
      - Refund
      operationId: requestRefund
      summary: Yêu cầu Refund
      description: Owner, Order PAID, vé chưa dùng, >=48 giờ tại thời điểm yêu cầu. Chính sách hoàn toàn bộ/một phần/tỷ lệ/phí chờ C04; request hiện chỉ reason nên chưa hỗ trợ chọn vé hoặc client tự chọn amount.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Refund REQUESTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: ORDER_NOT_REFUNDABLE hoặc REFUND_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: REFUND_WINDOW_EXPIRED (dưới 48 giờ) hoặc TICKET_ALREADY_CHECKED_IN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/refunds:
    get:
      tags:
      - Admin - Refund
      operationId: listRefunds
      summary: Danh sách Refund
      description: Role ADMIN hoặc ORGANIZER. Spec dùng `status=REQUESTED` cho danh sách chờ duyệt. ADMIN/ORGANIZER theo Hình 2.67; phạm vi ORGANIZER chỉ sự kiện sở hữu còn C04, không cho quyền mọi sự kiện theo role đơn thuần.
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/RefundStatus'
      responses:
        '200':
          description: Danh sách Refund
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/refunds/{id}/approve:
    post:
      tags:
      - Admin - Refund
      operationId: approveRefund
      summary: Duyệt Refund
      description: |-
        Role ADMIN hoặc ORGANIZER. Chuyển PROCESSING, gọi gateway với idempotency key riêng.
        Chỉ sau khi gateway xác nhận thì Refund và Order chuyển REFUNDED, gọi ticket-service hủy vé và publish `order.refunded`.
         ADMIN/ORGANIZER theo Hình 2.67; phạm vi ORGANIZER chỉ sự kiện sở hữu còn C04, không cho quyền mọi sự kiện theo role đơn thuần. Kiểm tra lại >=48 giờ/vé chưa dùng trước PROCESSING; provider thành công mới hủy vé, chỉ publish order.refunded sau hủy hoàn tất. Provider lỗi thì Refund FAILED, Order PAID và không hủy vé. Lỗi hủy vĩnh viễn sau hoàn tiền chờ C05.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RefundId'
      responses:
        '200':
          description: Refund sau khi duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RefundNotFound'
        '409':
          description: INVALID_REFUND_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/refunds/{id}/reject:
    post:
      tags:
      - Admin - Refund
      operationId: rejectRefund
      summary: Từ chối Refund
      description: Role ADMIN hoặc ORGANIZER. ADMIN/ORGANIZER theo Hình 2.67; phạm vi ORGANIZER chỉ sự kiện sở hữu còn C04, không cho quyền mọi sự kiện theo role đơn thuần.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RefundId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRefundRequest'
      responses:
        '200':
          description: Refund REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RefundNotFound'
        '409':
          description: INVALID_REFUND_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
    RefundId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền hoặc Order không thuộc user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderNotFound:
      description: ORDER_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RefundNotFound:
      description: REFUND_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OrderStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - PAID
      - FAILED
      - EXPIRED
      - REFUNDED
    PaymentStatus:
      type: string
      enum:
      - CREATED
      - PENDING
      - SUCCEEDED
      - FAILED
    RefundStatus:
      type: string
      enum:
      - REQUESTED
      - APPROVED
      - REJECTED
      - PROCESSING
      - REFUNDED
      - FAILED
    HolderInput:
      type: object
      required:
      - holderName
      properties:
        holderName:
          type: string
        holderEmail:
          type: string
          format: email
          nullable: true
          description: Có thể NULL theo Bảng 2.12; nguồn/fallback gửi vé chờ C02.
        holderPhone:
          type: string
          nullable: true
    OrderItemInput:
      type: object
      required:
      - ticketTypeId
      - quantity
      - holders
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        quantity:
          type: integer
          minimum: 1
        holders:
          type: array
          description: Mỗi vé một người nhận; số phần tử phải bằng quantity. Lưu order_holders, không gộp holder vào dòng order_items.
          items:
            $ref: '#/components/schemas/HolderInput'
          minItems: 1
    CreateOrderRequest:
      type: object
      required:
      - eventId
      - items
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
    OrderItemResponse:
      type: object
      description: Snapshot tên và giá tại thời điểm đặt
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        ticketTypeName:
          type: string
          example: VIP
        quantity:
          type: integer
        unitPrice:
          type: number
        lineTotal:
          type: number
        holders:
          type: array
          items:
            $ref: '#/components/schemas/HolderResponse'
    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        customerId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        reservationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        subtotal:
          type: number
        totalAmount:
          type: number
        currency:
          type: string
          example: VND
        expiresAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      description: Page<OrderResponse> theo Spring Data via-dto.
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'
    PageMetadata:
      type: object
      required:
      - size
      - number
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    InitPaymentRequest:
      type: object
      properties:
        provider:
          type: string
          description: Provider sandbox còn chờ C06; ví dụ không phải lựa chọn được xác nhận.
    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paymentUrl:
          type: string
          description: Payment URL hoặc client token
        amount:
          type: number
    WebhookPayload:
      type: object
      required:
      - providerEventId
      - providerTransactionId
      - orderId
      - amount
      - status
      properties:
        providerEventId:
          type: string
          description: UNIQUE, dùng chống xử lý lặp
        providerTransactionId:
          type: string
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        amount:
          type: number
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
      description: DTO chuẩn hóa nội bộ sau xác minh chữ ký provider, KHÔNG phải wire format webhook công khai. Provider thật có thể gửi query/form/JSON và mã trạng thái khác; C06 chưa chốt.
    RefundRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
    RejectRefundRequest:
      type: object
      properties:
        reason:
          type: string
    RefundResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          type: number
        reason:
          type: string
        requestedBy:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        approvedBy:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          nullable: true
        requestedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        refundedAt:
          type: string
          format: date-time
          nullable: true
        reviewReason:
          type: string
          nullable: true
          description: Bổ sung kỹ thuật lưu lý do review vào refund_requests.review_reason; khác reason của người yêu cầu.
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: ORDER_NOT_FOUND
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
    HolderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        holderName:
          type: string
        holderEmail:
          type: string
          format: email
          nullable: true
        holderPhone:
          type: string
          nullable: true
x-source: BC_32_V2 §2.2–2.3 + xác nhận trực tiếp chủ dự án
x-implementation-status: scaffold-only
x-open-decisions: ../project-clarifications.md
