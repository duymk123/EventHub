openapi: 3.0.3
info:
  title: EventHub - Ticket Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng mục tiêu đối chiếu BC_32_V2 và xác nhận chủ dự án ngày 2026-10-27. Đã triển khai mọi operation dưới đây (2026-11-19, trạng thái chi tiết ở docs/plans/ticket-service.md); hold/token hoàn tiền C05 và xác thực thiết bị cổng C07 vẫn chờ.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    C12 (2026-11-22, đã triển khai 2026-11-23): bán vé theo ghế. Zone = hạng vé; ghế sinh từ rowCount × seatsPerRow của từng sự kiện; tồn kho là bảng seats (AVAILABLE/HELD/SOLD), không còn bộ đếm available/reserved/sold. Không có ticket_inventory hoặc events cục bộ. Reservation RESERVED/CONFIRMED/RELEASED/EXPIRED. Quét một lần vào, một lần ra; không tái nhập. gateId UUID; C07 quét bằng JWT ORGANIZER/ADMIN trong khung giờ sự kiện, không có bảng thiết bị.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Ticket Type
- name: Ticket
- name: Gate
- name: Internal
paths:
  /ticket-types:
    post:
      tags:
      - Ticket Type
      operationId: createTicketTypes
      summary: Khởi tạo 1..3 Ticket Type cho Event
      description: |
        Role ORGANIZER (owner của Event, kiểm tra qua `GET /internal/events/{id}` của event-service).
        `name` chỉ nhận VIP / PREMIUM / STANDARD, không trùng trong request và với hạng đã có (C08: không bắt buộc đủ ba hạng, quota được bằng 0).
        C12: mỗi hạng là một zone; Ticket sinh ghế hàng A, B, C… ghế 1..seatsPerRow trong cùng transaction tạo hạng.
        Event Service không phản hồi → 503 EVENT_SERVICE_UNAVAILABLE.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketTypesRequest'
      responses:
        '201':
          description: Các Ticket Type vừa tạo, thứ tự VIP, PREMIUM, STANDARD
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketTypeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND (eventId không tồn tại ở Event Service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: TICKET_TYPES_ALREADY_EXIST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ticket-types/{id}:
    put:
      tags:
      - Ticket Type
      operationId: updateTicketType
      summary: Cập nhật giá, sơ đồ ghế, trạng thái
      description: 'Tên không đổi. C12: tăng rowCount thêm hàng mới; giảm rowCount hoặc đổi seatsPerRow chỉ khi các ghế bị ảnh hưởng chưa từng thuộc reservation nào (reservation_seats giữ lịch sử), ngược lại 409 SEAT_LAYOUT_LOCKED.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketTypeRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTypeResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: SEAT_LAYOUT_LOCKED (bớt hàng hoặc đổi seatsPerRow khi các ghế đó đã từng được giữ/bán)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: TICKET_TYPE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{eventId}/ticket-types:
    get:
      tags:
      - Ticket Type
      operationId: listTicketTypesByEvent
      summary: Xem các zone (Ticket Type), giá và số ghế còn trống
      description: Public. C12 dùng cho màn 3D chọn zone; availableSeats đếm từ bảng seats, gần realtime.
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Danh sách Ticket Type của Event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketTypeResponse'
  /ticket-types/{id}/seats:
    get:
      tags:
      - Ticket Type
      operationId: getSeatMap
      summary: Sơ đồ ghế của một zone (C12)
      description: Public. Trả mọi hàng và ghế của zone kèm trạng thái để frontend vẽ sơ đồ và cho chọn ghế. Frontend làm mới mỗi 3–5 giây; trạng thái chỉ để hiển thị, quyết định cuối cùng là lúc giữ ghế.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Sơ đồ ghế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapResponse'
        '404':
          description: TICKET_TYPE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tickets/me:
    get:
      tags:
      - Ticket
      operationId: getMyTickets
      summary: Danh sách vé của tôi
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Vé của người dùng hiện tại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tickets/{id}/qr:
    get:
      tags:
      - Ticket
      operationId: getTicketQr
      summary: Lấy QR của vé
      description: Kiểm tra quyền sở hữu. QR là token opaque, không chứa dữ liệu nhạy cảm.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Giá trị QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: TICKET_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gate/check-in:
    post:
      tags:
      - Gate
      operationId: checkIn
      summary: Check-in bằng QR
      description: 'C07 (2026-11-22): ORGANIZER chủ sự kiện hoặc ADMIN quét bằng trang web dùng camera, Bearer JWT của chính họ. Chỉ trong khung giờ sự kiện: từ 60 phút trước startTime (cấu hình eventhub.ticket.gate.open-before) đến endTime, ngoài khung 409 SCAN_OUTSIDE_EVENT_TIME. Chỉ ISSUED → CHECKED_IN bằng CAS, ghi ticket_scans và outbox cùng transaction; CHECKED_OUT không được tái nhập. gateId là UUID chọn trên trang quét, không có bảng thiết bị.'
      security:
      - gateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateScanRequest'
      responses:
        '200':
          description: Check-in thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateScanResponse'
        '400':
          description: INVALID_QR hoặc TICKET_WRONG_EVENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: INVALID_TICKET_STATE (vé không ở ISSUED) hoặc SCAN_OUTSIDE_EVENT_TIME (ngoài khung giờ quét, C07)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gate/check-out:
    post:
      tags:
      - Gate
      operationId: checkOut
      summary: Check-out bằng QR
      description: Cùng quyền và khung giờ như check-in (C07). Chỉ CHECKED_IN → CHECKED_OUT bằng CAS, ghi log và outbox cùng transaction. Không có nhánh check-in lại theo Hình 2.56.
      security:
      - gateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateScanRequest'
      responses:
        '200':
          description: Check-out thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateScanResponse'
        '400':
          description: INVALID_QR hoặc TICKET_WRONG_EVENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: INVALID_TICKET_STATE (vé không ở CHECKED_IN) hoặc SCAN_OUTSIDE_EVENT_TIME (ngoài khung giờ quét, C07)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/reservations:
    post:
      tags:
      - Internal
      operationId: reserveTickets
      summary: Giữ ghế (Order Service gọi)
      description: |
        C12: giữ đúng các ghế khách đã chọn, tối đa 10 phút (C16), tối đa 10 ghế mỗi đơn. Từ chối 409 `TICKET_TYPE_NOT_ON_SALE` khi sự kiện không PUBLISHED hoặc đã tới `startTime` (C17). Idempotent theo `orderId`: request lặp trả lại Reservation cũ.
        Một transaction: UPDATE seats SET status=HELD, reservation_id WHERE id IN (seatIds) AND status=AVAILABLE, so số dòng đổi được với số ghế; thiếu thì rollback và trả 409 SEAT_TAKEN kèm takenSeatIds. Thành công thì tạo reservation, reservation_items (giá snapshot) và reservation_seats.
        Trả giá chính thức, client không được quyết định giá.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '200':
          description: Reservation (mới hoặc đã tồn tại)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: TICKET_TYPE_NOT_FOUND hoặc SEAT_NOT_FOUND (ghế không tồn tại hoặc không thuộc hạng vé/sự kiện)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: SEAT_TAKEN (kèm takenSeatIds), TICKET_TYPE_NOT_ON_SALE (hạng INACTIVE hoặc sự kiện chưa PUBLISHED) hoặc RESERVATION_PAYLOAD_MISMATCH (cùng orderId khác danh sách ghế)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
  /internal/reservations/{id}/confirm:
    post:
      tags:
      - Internal
      operationId: confirmReservation
      summary: Confirm Reservation và phát hành vé
      description: 'Hình 2.50, C12 mỗi ghế HELD → SOLD và một vé: CONFIRMED trả vé cũ; RELEASED/EXPIRED hoặc RESERVED đã hết hạn trả 409. CAS RESERVED → CONFIRMED và cập nhật tồn kho + tạo vé/QR trong một transaction. Không có bước phát vé từ consumer order.paid.'
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Reservation đã CONFIRMED kèm danh sách vé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: RESERVATION_RELEASED_OR_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
  /internal/reservations/{id}/release:
    post:
      tags:
      - Internal
      operationId: releaseReservation
      summary: Release Reservation
      description: 'Hình 2.53: chỉ RESERVED → RELEASED, trả quota một lần. RELEASED/EXPIRED lặp trả kết quả cũ; CONFIRMED trả 409, phải dùng cancel theo nghiệp vụ hoàn tiền.'
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Trạng thái Reservation sau khi release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStatusResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: RESERVATION_ALREADY_CONFIRMED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
  /internal/tickets/cancel-by-order/{orderId}:
    post:
      tags:
      - Internal
      operationId: cancelTicketsByOrder
      summary: Hủy vé sau Refund thành công
      description: 'C05 rút gọn (2026-11-22): Order gọi sau khi ADMIN duyệt hoàn tiền, trước khi gọi VNPay. Một transaction: khóa mọi vé của đơn, tất cả phải ISSUED (có vé đã quét → 409 TICKET_ALREADY_CHECKED_IN, không hủy vé nào), ISSUED → CANCELLED, ghế SOLD → AVAILABLE (C12), outbox ticket.cancelled. Gọi lại khi đã hủy trả kết quả cũ, không trả ghế hai lần. Mốc 48 giờ do Order kiểm. Hold token là hướng phát triển.'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Kết quả hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không có vé nào thuộc Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: TICKET_ALREADY_CHECKED_IN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CANCEL_WINDOW_EXPIRED (còn dưới 48 giờ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
  /internal/ticket-types/capacity:
    get:
      tags:
      - Internal
      operationId: getCapacityByEvents
      summary: Tổng sức chứa theo sự kiện (đề xuất C10)
      description: |
        Đề xuất 2026-11-13, đã triển khai ở Ticket Service 2026-11-19 (client phía Analytics có từ 2026-11-14). Analytics gọi để hiển thị "vé bán / sức chứa" trong bảng thống kê theo sự kiện.
        capacity = SUM(total_quota) mọi hạng của sự kiện, kể cả hạng INACTIVE (sức chứa đã cấu hình), không phải số còn bán.
        Sự kiện chưa cấu hình hạng vé trả capacity=0. Không lộ giá/quota từng hạng ở operation này.
      parameters:
      - name: eventIds
        in: query
        required: true
        description: Danh sách UUID sự kiện phân tách dấu phẩy, 1..100 phần tử.
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
      responses:
        '200':
          description: Sức chứa của từng sự kiện được yêu cầu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventCapacityResponse'
        '400':
          description: VALIDATION_ERROR (rỗng, quá 100 id hoặc sai UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
  /internal/events/{eventId}/ticket-types/configuration:
    get:
      tags:
      - Internal
      operationId: getTicketConfiguration
      summary: Preflight publish C08 (Event Service gọi)
      description: |
        Triển khai 2026-11-19. Chỉ client eventhub-event-service. readyToPublish = có ít nhất một hạng ACTIVE với
        total_quota > 0 (không buộc đủ ba hạng). Sự kiện chưa có hạng vé trả readyToPublish=false, không 404.
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cấu hình vé hiện tại của sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketConfigurationResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation (chỉ Event Service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; Bearer token client_credentials (serviceAuth)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
    gateAuth:
      type: apiKey
      in: header
      name: X-Gate-Token
      description: 'Giữ để tương thích tài liệu cũ, không dùng. C07 (2026-11-22) chốt quét bằng Bearer JWT của ORGANIZER chủ sự kiện hoặc ADMIN, không có token thiết bị.'
      x-contract-status: unused-C07
    serviceAuth:
      type: http
      scheme: bearer
      description: 'Bearer access token client_credentials của Keycloak. Ticket chỉ nhận token có azp thuộc danh sách eventhub.security.internal-clients (mặc định eventhub-order-service, eventhub-analytics-service); token người dùng bị 403.'
      x-contract-status: pending-s2s-mechanism
  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
