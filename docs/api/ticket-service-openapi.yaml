openapi: 3.0.3
info:
  title: EventHub - Ticket Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng mục tiêu đối chiếu BC_32_V2 và xác nhận chủ dự án ngày 2026-10-27. Mã nguồn hiện là scaffold, chưa có endpoint nghiệp vụ.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    Tồn kho gộp ticket_types; không có ticket_inventory hoặc events cục bộ. Reservation RESERVED/CONFIRMED/RELEASED/EXPIRED. Quét một lần vào, một lần ra; không tái nhập. gateId UUID, owner cổng/xác thực thiết bị còn C07.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Ticket Type
- name: Ticket
- name: Gate
- name: Internal
paths:
  /ticket-types:
    post:
      tags:
      - Ticket Type
      operationId: createTicketTypes
      summary: Khởi tạo 3 Ticket Type cho Event
      description: |
        Role ORGANIZER (owner của Event, kiểm tra qua `GET /internal/events/{id}` của event-service).
        `name` chỉ nhận VIP / PREMIUM / STANDARD, mỗi loại đúng một lần.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketTypesRequest'
      responses:
        '201':
          description: Đã tạo 3 Ticket Type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketTypeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: TICKET_TYPES_ALREADY_EXIST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ticket-types/{id}:
    put:
      tags:
      - Ticket Type
      operationId: updateTicketType
      summary: Cập nhật giá, quota, trạng thái
      description: Tên không đổi. `totalQuota` không được nhỏ hơn số vé đã bán + đang giữ.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketTypeRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTypeResponse'
        '400':
          description: VALIDATION_ERROR hoặc QUOTA_BELOW_SOLD_RESERVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: TICKET_TYPE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{eventId}/ticket-types:
    get:
      tags:
      - Ticket Type
      operationId: listTicketTypesByEvent
      summary: Xem Ticket Type, giá và số vé còn lại
      description: Public, số lượng gần realtime.
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Danh sách Ticket Type của Event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketTypeResponse'
  /tickets/me:
    get:
      tags:
      - Ticket
      operationId: getMyTickets
      summary: Danh sách vé của tôi
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Vé của người dùng hiện tại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tickets/{id}/qr:
    get:
      tags:
      - Ticket
      operationId: getTicketQr
      summary: Lấy QR của vé
      description: Kiểm tra quyền sở hữu. QR là token opaque, không chứa dữ liệu nhạy cảm.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Giá trị QR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: TICKET_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gate/check-in:
    post:
      tags:
      - Gate
      operationId: checkIn
      summary: Check-in bằng QR
      description: Chỉ ISSUED → CHECKED_IN bằng CAS, ghi ticket_scans và outbox cùng transaction; CHECKED_OUT không được tái nhập. gateId phải thuộc thiết bị/sự kiện được phép (C07).
      security:
      - gateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateScanRequest'
      responses:
        '200':
          description: Check-in thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateScanResponse'
        '400':
          description: INVALID_QR hoặc TICKET_WRONG_EVENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: INVALID_TICKET_STATE (vé không ở ISSUED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gate/check-out:
    post:
      tags:
      - Gate
      operationId: checkOut
      summary: Check-out bằng QR
      description: Chỉ CHECKED_IN → CHECKED_OUT bằng CAS, ghi log và outbox cùng transaction. Không có nhánh check-in lại theo Hình 2.56.
      security:
      - gateAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateScanRequest'
      responses:
        '200':
          description: Check-out thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateScanResponse'
        '400':
          description: INVALID_QR hoặc TICKET_WRONG_EVENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: INVALID_TICKET_STATE (vé không ở CHECKED_IN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal/reservations:
    post:
      tags:
      - Internal
      operationId: reserveTickets
      summary: Reserve Ticket (Order Service gọi)
      description: |
        Giữ nhiều Ticket Type tối đa 3 phút. Idempotent theo `orderId`: request lặp trả lại Reservation cũ.
        Kiểm tra quota + giảm `available` + tăng `reserved` + tạo Reservation trong một transaction atomic.
        Trả giá chính thức, client không được quyết định giá.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '200':
          description: Reservation (mới hoặc đã tồn tại)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: TICKET_TYPE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: INSUFFICIENT_TICKETS hoặc TICKET_TYPE_NOT_ON_SALE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; S2S auth chưa chốt
  /internal/reservations/{id}/confirm:
    post:
      tags:
      - Internal
      operationId: confirmReservation
      summary: Confirm Reservation và phát hành vé
      description: 'Hình 2.50: CONFIRMED trả vé cũ; RELEASED/EXPIRED hoặc RESERVED đã hết hạn trả 409. CAS RESERVED → CONFIRMED và cập nhật tồn kho + tạo vé/QR trong một transaction. Không có bước phát vé từ consumer order.paid.'
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Reservation đã CONFIRMED kèm danh sách vé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: RESERVATION_RELEASED_OR_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; S2S auth chưa chốt
  /internal/reservations/{id}/release:
    post:
      tags:
      - Internal
      operationId: releaseReservation
      summary: Release Reservation
      description: 'Hình 2.53: chỉ RESERVED → RELEASED, trả quota một lần. RELEASED/EXPIRED lặp trả kết quả cũ; CONFIRMED trả 409, phải dùng cancel theo nghiệp vụ hoàn tiền.'
      parameters:
      - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Trạng thái Reservation sau khi release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationStatusResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/ReservationNotFound'
        '409':
          description: RESERVATION_ALREADY_CONFIRMED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; S2S auth chưa chốt
  /internal/tickets/cancel-by-order/{orderId}:
    post:
      tags:
      - Internal
      operationId: cancelTicketsByOrder
      summary: Hủy vé sau Refund thành công
      description: 'Hình 2.54: sau provider xác nhận hoàn tiền, chỉ hủy vé ISSUED, kiểm tra >=48 giờ; gọi lặp vé đã CANCELLED không trả quota lần hai. Nếu trạng thái đã dùng hoặc quá hạn trả 409. Khoảng trống đã hoàn tiền nhưng cancel bị từ chối còn C05, không giải quyết bằng retry vô hạn.'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '200':
          description: Kết quả hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '401':
          description: Service credential thiếu/không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Service không có quyền gọi operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không có vé nào thuộc Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: TICKET_ALREADY_CHECKED_IN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CANCEL_WINDOW_EXPIRED (còn dưới 48 giờ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - serviceAuth: []
    servers:
    - url: http://localhost:8083
      description: Gọi trực tiếp service, không qua public Gateway; S2S auth chưa chốt
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
    gateAuth:
      type: apiKey
      in: header
      name: X-Gate-Token
      description: X-Gate-Token là placeholder đề xuất của API draft, không phải cơ chế thiết bị đã được chốt. gateId UUID; owner/quyền thiết bị còn C07.
      x-contract-status: pending-C07
    serviceAuth:
      type: http
      scheme: bearer
      description: 'Placeholder hợp đồng draft: internal bắt buộc xác thực service. Bearer là đề xuất thể hiện yêu cầu, không phải cơ chế S2S đã được chốt; thay khi có cấu hình Keycloak/S2S.'
      x-contract-status: pending-s2s-mechanism
  parameters:
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền hoặc không phải owner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReservationNotFound:
      description: RESERVATION_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TicketTypeName:
      type: string
      enum:
      - VIP
      - PREMIUM
      - STANDARD
    TicketTypeStatus:
      type: string
      description: ACTIVE là trạng thái nêu rõ trong V2; INACTIVE là đề xuất kỹ thuật tắt bán. SOLD_OUT tính từ quota, không là trạng thái lưu bắt buộc.
      enum:
      - ACTIVE
      - INACTIVE
      x-contract-status: INACTIVE-proposed
    ReservationStatus:
      type: string
      enum:
      - RESERVED
      - CONFIRMED
      - RELEASED
      - EXPIRED
    TicketStatus:
      type: string
      enum:
      - ISSUED
      - CHECKED_IN
      - CHECKED_OUT
      - CANCELLED
    TicketTypeInput:
      type: object
      required:
      - name
      - price
      - totalQuota
      properties:
        name:
          $ref: '#/components/schemas/TicketTypeName'
        price:
          type: number
          example: 1500000
        totalQuota:
          type: integer
          minimum: 0
          example: 200
          description: Không âm về mặt invariant; yêu cầu quota > 0 và đủ ba hạng còn C08.
    CreateTicketTypesRequest:
      type: object
      required:
      - eventId
      - ticketTypes
      properties:
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          example: 10000000-0000-4000-8000-000000000001
        ticketTypes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/TicketTypeInput'
      description: Chỉ cho các tên VIP/PREMIUM/STANDARD, không lặp tên trong cùng event. Có bắt buộc tạo cả ba cùng lúc chưa chốt C08; hợp đồng draft không áp đặt minItems=3.
    UpdateTicketTypeRequest:
      type: object
      properties:
        price:
          type: number
        totalQuota:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/TicketTypeStatus'
    TicketTypeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        name:
          $ref: '#/components/schemas/TicketTypeName'
        price:
          type: number
        totalQuota:
          type: integer
        availableQuantity:
          type: integer
        reservedQuantity:
          type: integer
        soldQuantity:
          type: integer
        status:
          $ref: '#/components/schemas/TicketTypeStatus'
    ReserveItem:
      type: object
      required:
      - ticketTypeId
      - quantity
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        quantity:
          type: integer
          minimum: 1
    ReserveRequest:
      type: object
      required:
      - orderId
      - eventId
      - items
      properties:
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        expiresAt:
          type: string
          format: date-time
          description: Đề xuất hạn phối hợp giữa hai service; Ticket kiểm tra không vượt TTL 3 phút, hoặc tự cấp khi thiếu. Giá trị trả về là hạn dùng của Order, không gia hạn khi retry.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReserveItem'
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
    ReservedItem:
      type: object
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        name:
          $ref: '#/components/schemas/TicketTypeName'
        quantity:
          type: integer
        unitPrice:
          type: number
    ReservationResponse:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/ReservationStatus'
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservedItem'
    ReservationStatusResponse:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/ReservationStatus'
    Holder:
      type: object
      required:
      - ticketTypeId
      - holderName
      - ownerUserId
      properties:
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        holderName:
          type: string
        holderEmail:
          type: string
          format: email
          description: NULL theo Bảng 2.12; fallback email chờ C02. Giữ trong payload/outbox snapshot để retry không mất dữ liệu dù tickets không có cột email.
          nullable: true
        ownerUserId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
          description: Bắt buộc theo Bảng 2.9; buyer hay holder còn C02, phải lấy từ nguồn tin cậy của Order.
    ConfirmRequest:
      type: object
      required:
      - holders
      properties:
        holders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Holder'
      description: Mỗi vé một holder, số holder theo ticketTypeId đúng số đã reserve; Order lấy từ order_holders. Gọi lại cùng reservation trả bộ vé cũ, không tạo QR mới.
    TicketResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        orderId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        eventId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        ticketTypeId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        ticketTypeName:
          $ref: '#/components/schemas/TicketTypeName'
        holderName:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        issuedAt:
          type: string
          format: date-time
    ConfirmResponse:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        status:
          $ref: '#/components/schemas/ReservationStatus'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketResponse'
    QrResponse:
      type: object
      properties:
        ticketId:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        qrCodeValue:
          type: string
          description: Token ngẫu nhiên / opaque
    GateScanRequest:
      type: object
      required:
      - qrCodeValue
      - eventId
      - gateId
      properties:
        qrCodeValue:
          type: string
        eventId:
          type: string
