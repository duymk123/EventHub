openapi: 3.0.3
info:
  title: EventHub - Notification Service API
  version: 2.0.0-draft
  description: |-
    Hợp đồng mục tiêu đối chiếu BC_32_V2 và xác nhận chủ dự án ngày 2026-10-27. Mã nguồn hiện là scaffold, chưa có endpoint nghiệp vụ.
    UUID cho mọi PK/tham chiếu EventHub; provider IDs là string bên ngoài. Xác thực do Keycloak cấp token; issuer/audience/JWK/role mapper/S2S còn chờ cấu hình.
    Đọc docs/architecture/source-decisions.md và docs/project-clarifications.md trước khi triển khai; draft không có nghĩa mọi quy tắc kinh doanh đã chốt.
    EMAIL và IN_APP theo Hình 2.73–2.77; reminder/PUSH chưa có luồng triển khai. Pagination, unread-count, PUT template là chuẩn hóa kỹ thuật đề xuất, khác API bản cũ; chưa có client nghiệp vụ trong repo.
servers:
- url: http://localhost:8080/api/v1
  description: API Gateway (local)
tags:
- name: Notification
- name: Admin - Template
paths:
  /notifications/me:
    get:
      tags:
      - Notification
      operationId: getMyNotifications
      summary: Danh sách thông báo in-app của tôi
      security:
      - bearerAuth: []
      parameters:
      - name: unreadOnly
        in: query
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Chỉ IN_APP của Principal hiện tại; unreadOnly=true lọc read_at IS NULL. Nội dung render lưu snapshot, không đổi theo template mới. Phân trang là bổ sung kỹ thuật.
  /notifications/{id}/read:
    put:
      tags:
      - Notification
      operationId: markAsRead
      summary: Đánh dấu đã đọc
      description: 'Idempotent: chỉ set readAt khi đang NULL; chỉ IN_APP của user hiện tại. Không tồn tại hoặc thuộc người khác đều 404 (chuẩn hóa kỹ thuật tránh lộ thông báo).'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
      responses:
        '204':
          description: Đã đánh dấu đọc, hoặc đã đọc trước đó
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: NOTIFICATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/notification-templates:
    get:
      tags:
      - Admin - Template
      operationId: listTemplates
      summary: Danh sách template, chỉ ADMIN
      security:
      - bearerAuth: []
      x-contract-status: technical-proposal
      responses:
        '200':
          description: Danh sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notifications/me/unread-count:
    get:
      tags:
      - Notification
      operationId: getUnreadCount
      summary: Số thông báo IN_APP chưa đọc
      security:
      - bearerAuth: []
      x-contract-status: technical-proposal
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/notification-templates/{code}:
    put:
      tags:
      - Admin - Template
      operationId: upsertTemplate
      summary: Upsert theo code và channel, chỉ ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z_]+$
          maxLength: 50
      x-contract-status: technical-proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Admin - Template
      operationId: getTemplate
      summary: Chi tiết template, chỉ ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z_]+$
          maxLength: 50
      - name: channel
        in: query
        schema:
          $ref: '#/components/schemas/Channel'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: TEMPLATE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-contract-status: technical-proposal
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do Keycloak cấp, Auth facade phục vụ UI/API riêng; mapping sub UUID/business role theo cấu hình realm còn chờ hoàn thiện. Không dùng ID token để gọi API.
  responses:
    Unauthorized:
      description: Thiếu hoặc sai JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Channel:
      type: string
      enum:
      - EMAIL
      - IN_APP
    NotificationStatus:
      type: string
      enum:
      - PENDING
      - SENT
      - FAILED
    NotificationResponse:
      type: object
      required:
      - id
      - channel
      - templateCode
      - title
      - content
      - status
      - readAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        channel:
          type: string
          enum:
          - IN_APP
        templateCode:
          type: string
        title:
          type: string
        content:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    TemplateRequest:
      type: object
      required:
      - channel
      - subject
      - bodyTemplate
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        subject:
          type: string
          maxLength: 255
        bodyTemplate:
          type: string
          minLength: 1
    TemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          minLength: 36
          maxLength: 36
        code:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        subject:
          type: string
        bodyTemplate:
          type: string
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - timestamp
      - path
      properties:
        code:
          type: string
          example: NOTIFICATION_NOT_FOUND
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          description: Đường dẫn HTTP của request gây lỗi
    NotificationPage:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 0
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UnreadCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          minimum: 0
x-source: BC_32_V2 §2.2–2.3 + xác nhận trực tiếp chủ dự án
x-implementation-status: scaffold-only
x-open-decisions: ../project-clarifications.md
