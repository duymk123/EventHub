# Cách hiểu các phần trong application.yml
# spring dùng ${ABC} để lấy giá trị từ các biến môi trường, với ABC là tên biến 
# sau dấu : là giá trị mặc đinh nếu biến chưa được đặt

# Nói gọn: IDE Run Configuration chọn giá trị cho service chạy từ IDE; Compose chọn giá trị cho service chạy trong Docker.

spring:
  application:
    name: auth-service
  datasource:
    # Mặc định chạy thẳng từ IntelliJ: MySQL cài trên máy (cổng 3306, root/root), database tự tạo nếu chưa có.
    # Docker Compose tự truyền DB_HOST/DB_PORT/DB_PASSWORD riêng nên không bị ảnh hưởng.
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventhub_auth}?serverTimezone=UTC&createDatabaseIfNotExist=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false    
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak chạy bằng Docker (docker compose up -d keycloak-db keycloak), cổng 8180, realm eventhub.
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/eventhub}"

eventhub:
  keycloak:
    # Auth Service gọi Keycloak (Admin API + token endpoint) bằng client confidential eventhub-auth-service.
    # Secret dưới đây chỉ dành cho dev, khớp infrastructure/keycloak/eventhub-realm.json; môi trường thật đặt qua biến.
    server-url: "${KEYCLOAK_SERVER_URL:http://localhost:8180}"
    realm: "${KEYCLOAK_REALM:eventhub}"
    client-id: "${KEYCLOAK_AUTH_CLIENT_ID:eventhub-auth-service}"
    client-secret: "${KEYCLOAK_AUTH_CLIENT_SECRET:eventhub-auth-service-dev-secret}"

server:
  port: "${SERVER_PORT:8081}"
