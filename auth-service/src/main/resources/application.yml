# Cách hiểu các phần trong application.yml
# spring dùng ${ABC} để lấy giá trị từ các biến môi trường, với ABC là tên biến 
# sau dấu : là giá trị mặc đinh nếu biến chưa được đặt

# Nói gọn: IDE Run Configuration chọn giá trị cho service chạy từ IDE; Compose chọn giá trị cho service chạy trong Docker.

spring:
  application:
    name: auth-service
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventhub_auth}?serverTimezone=UTC&createDatabaseIfNotExist=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false    

server:
  port: "${SERVER_PORT:8081}"
