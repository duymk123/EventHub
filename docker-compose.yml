name: eventhub

services:
  auth-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_auth
    ports:
      - "33101:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  event-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_event
    ports:
      - "33102:3306"
    volumes:
      - event_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  ticket-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_ticket
    ports:
      - "33103:3306"
    volumes:
      - ticket_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_order
    ports:
      - "33104:3306"
    volumes:
      - order_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  notification-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_notification
    ports:
      - "33105:3306"
    volumes:
      - notification_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  analytics-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_analytics
    ports:
      - "33106:3306"
    volumes:
      - analytics_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  api-gateway-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_gateway
    ports:
      - "33107:3306"
    volumes:
      - api_gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  auth-service:
    image: eventhub/auth-service:local
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: auth-db
      DB_PORT: "3306"
      DB_NAME: eventhub_auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      auth-db:
        condition: service_healthy

  event-service:
    image: eventhub/event-service:local
    build:
      context: .
      dockerfile: event-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: event-db
      DB_PORT: "3306"
      DB_NAME: eventhub_event
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      event-db:
        condition: service_healthy

  ticket-service:
    image: eventhub/ticket-service:local
    build:
      context: .
      dockerfile: ticket-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: ticket-db
      DB_PORT: "3306"
      DB_NAME: eventhub_ticket
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      ticket-db:
        condition: service_healthy

  order-service:
    image: eventhub/order-service:local
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: order-db
      DB_PORT: "3306"
      DB_NAME: eventhub_order
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      order-db:
        condition: service_healthy

  notification-service:
    image: eventhub/notification-service:local
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: notification-db
      DB_PORT: "3306"
      DB_NAME: eventhub_notification
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      notification-db:
        condition: service_healthy

  analytics-service:
    image: eventhub/analytics-service:local
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: analytics-db
      DB_PORT: "3306"
      DB_NAME: eventhub_analytics
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      analytics-db:
        condition: service_healthy

  api-gateway:
    image: eventhub/api-gateway:local
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_HOST: api-gateway-db
      DB_PORT: "3306"
      DB_NAME: eventhub_gateway
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      api-gateway-db:
        condition: service_healthy

networks:
  eventhub:
    driver: bridge

volumes:
  auth_mysql_data:
  event_mysql_data:
  ticket_mysql_data:
  order_mysql_data:
  notification_mysql_data:
  analytics_mysql_data:
  api_gateway_mysql_data:
