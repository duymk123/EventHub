name: eventhub

# Cấu hình Keycloak dùng chung cho service chạy trong Docker: issuer là địa chỉ trình duyệt/Postman thấy
# (KC_HOSTNAME), còn JWK và token endpoint gọi qua mạng nội bộ keycloak:8080.
x-keycloak-env: &keycloak-env
  KEYCLOAK_ISSUER: http://localhost:8180/realms/eventhub
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/eventhub/protocol/openid-connect/certs
  KEYCLOAK_SERVICE_TOKEN_URI: http://keycloak:8080/realms/eventhub/protocol/openid-connect/token
  EVENTHUB_JWT_AUDIENCE: eventhub-api

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  kafka-init:
    image: apache/kafka:3.8.1
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./infrastructure/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks:
      - eventhub

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventhub-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - eventhub

  mailpit:
    image: axllent/mailpit:v1.20.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - eventhub

# Database Services
# Database riêng dành cho Keycloak
  keycloak-db:
    image: postgres:17-alpine
    container_name: eventhub-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eventhub

  # Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: eventhub-keycloak
    # --import-realm nạp realm eventhub từ file dùng chung với chế độ chạy local; realm đã tồn tại thì bỏ qua.
    command: start-dev --import-realm
    volumes:
      - ./infrastructure/keycloak/eventhub-realm.json:/opt/keycloak/data/import/eventhub-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_password

      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
      # Issuer cố định http://localhost:8180 cho cả token lấy từ máy (IDE/Postman) lẫn từ container
      # (gọi http://keycloak:8080): service chỉ chấp nhận đúng một issuer.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

    ports:
      - "8180:8080"

    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - eventhub
# Auth Service DB
  auth-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_auth
    ports:
      - "33101:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

# Event Service DB
  event-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_event
    ports:
      - "33102:3306"
    volumes:
      - event_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  ticket-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_ticket
    ports:
      - "33103:3306"
    volumes:
      - ticket_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_order
    ports:
      - "33104:3306"
    volumes:
      - order_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  notification-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_notification
    ports:
      - "33105:3306"
    volumes:
      - notification_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  analytics-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: eventhub_analytics
    ports:
      - "33106:3306"
    volumes:
      - analytics_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

# Application Services
  auth-service:
    image: eventhub/auth-service:local
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      DB_HOST: auth-db
      DB_PORT: "3306"
      DB_NAME: eventhub_auth
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      auth-db:
        condition: service_healthy

  event-service:
    image: eventhub/event-service:local
    build:
      context: .
      dockerfile: event-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      TICKET_SERVICE_URL: http://ticket-service:8080
      DB_HOST: event-db
      DB_PORT: "3306"
      DB_NAME: eventhub_event
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      event-db:
        condition: service_healthy

  ticket-service:
    image: eventhub/ticket-service:local
    build:
      context: .
      dockerfile: ticket-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      EVENT_SERVICE_URL: http://event-service:8080
      DB_HOST: ticket-db
      DB_PORT: "3306"
      DB_NAME: eventhub_ticket
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      ticket-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  order-service:
    image: eventhub/order-service:local
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      TICKET_SERVICE_URL: http://ticket-service:8080
      DB_HOST: order-db
      DB_PORT: "3306"
      DB_NAME: eventhub_order
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      order-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notification-service:
    image: eventhub/notification-service:local
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      DB_HOST: notification-db
      DB_PORT: "3306"
      DB_NAME: eventhub_notification
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      notification-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  analytics-service:
    image: eventhub/analytics-service:local
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      DASHBOARD_ALLOWED_ORIGINS: http://localhost:3000
      DB_HOST: analytics-db
      DB_PORT: "3306"
      DB_NAME: eventhub_analytics
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENT_SERVICE_URL: http://event-service:8080
      TICKET_SERVICE_URL: http://ticket-service:8080
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      analytics-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  api-gateway:
    image: eventhub/api-gateway:local
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *keycloak-env
      SERVER_PORT: "8080"
      # Trong mạng Docker gọi service theo tên container và cổng nội bộ 8080.
      AUTH_SERVICE_URI: http://auth-service:8080
      EVENT_SERVICE_URI: http://event-service:8080
      TICKET_SERVICE_URI: http://ticket-service:8080
      ORDER_SERVICE_URI: http://order-service:8080
      NOTIFICATION_SERVICE_URI: http://notification-service:8080
      ANALYTICS_SERVICE_URI: http://analytics-service:8080
      ANALYTICS_WS_URI: ws://analytics-service:8080
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    networks:
      - eventhub

networks:
  eventhub:
    driver: bridge

# Volumes is used to persist data for services that require it, such as databases and Kafka.
volumes:
  kafka_data:
  keycloak_db_data:
  auth_mysql_data:
  event_mysql_data:
  ticket_mysql_data:
  order_mysql_data:
  notification_mysql_data:
  analytics_mysql_data:
  # Không còn dùng từ khi Gateway bỏ DB (2026-11-24); giữ khai báo để không xóa dữ liệu cũ.
  api_gateway_mysql_data:
