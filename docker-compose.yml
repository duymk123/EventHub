# Start all services and the local MySQL database: docker compose up --build -d
name: eventhub

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: eventhub_auth
      MYSQL_USER: ${DB_USERNAME:-eventhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - eventhub

  auth-service:
    image: eventhub/auth-service:local
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8081"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_auth
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  event-service:
    image: eventhub/event-service:local
    build:
      context: .
      dockerfile: event-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8082"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_event
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  ticket-service:
    image: eventhub/ticket-service:local
    build:
      context: .
      dockerfile: ticket-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8083"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_ticket
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    image: eventhub/order-service:local
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8084"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_order
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    image: eventhub/notification-service:local
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8085"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_notification
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  analytics-service:
    image: eventhub/analytics-service:local
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8086"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_analytics
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    image: eventhub/api-gateway:local
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventhub_gateway
      DB_USERNAME: ${DB_USERNAME:-eventhub}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: unless-stopped
    networks:
      - eventhub
    depends_on:
      mysql:
        condition: service_healthy

networks:
  eventhub:
    driver: bridge

volumes:
  mysql_data:
